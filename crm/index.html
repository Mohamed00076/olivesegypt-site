<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Buyer CRM</title>
    <meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="/assets/crm.css" />
      <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#3f4f2b" />
  </head>
  <body>
    <div class="crm-container">
      <h1>Dashboard</h1>
      <!-- Enquiries first, because they are the only thing on this page that
           somebody outside the company is waiting on. Everything below is
           our own pipeline, which can wait a minute; a buyer who filled in
           the contact form cannot tell whether anyone has seen it. -->
      <div id="inbox-card"></div>

      <div id="dashboard-content">
        <p class="crm-muted">Loading…</p>
      </div>
    </div>
    <script src="/assets/small-sample.js"></script>
    <script src="/assets/crm.js"></script>
    <script>
      (function () {
        'use strict';

        function stageOrderIndex(stage) {
          var i = CRM.STAGES.indexOf(stage);
          return i === -1 ? CRM.STAGES.length : i;
        }

        function renderFollowupList(title, rows, emptyMsg) {
          if (!rows.length) return '<p class="crm-muted">' + emptyMsg + '</p>';
          var html = '<table><thead><tr><th>Company</th><th>Next Action</th><th>Due</th></tr></thead><tbody>';
          rows.forEach(function (r) {
            html += '<tr><td><a href="/crm/buyer/?id=' + r.id + '">' + CRM.escapeHtml(r.company_name) + '</a></td>' +
              '<td>' + CRM.escapeHtml(r.next_action || '') + '</td>' +
              '<td>' + CRM.fmtDate(r.next_action_due) + '</td></tr>';
          });
          html += '</tbody></table>';
          return html;
        }

        function renderInbox(list) {
          var card = document.getElementById('inbox-card');
          if (!list.length) {
            card.innerHTML = '<div class="crm-card"><h2>Enquiries</h2>' +
              '<p class="crm-muted">Nothing received yet. Enquiries from the website\u2019s ' +
              'contact and sample forms appear here.</p></div>';
            return;
          }
          var recent = list.slice(0, 5);
          var rowsHtml = recent.map(function (r) {
            return '<tr>' +
              '<td>' + CRM.fmtDate(r.created_at) + '</td>' +
              '<td><strong>' + CRM.escapeHtml(r.company || r.name || '(no name given)') + '</strong></td>' +
              '<td>' + CRM.escapeHtml(r.country || '') + '</td>' +
              '<td>' + CRM.escapeHtml(r.request_type || 'Enquiry') + '</td>' +
              '</tr>';
          }).join('');
          card.innerHTML = '<div class="crm-card">' +
            '<div class="crm-flex-between" style="margin-bottom:10px;">' +
              '<h2 style="margin:0;">Enquiries (' + list.length + ')</h2>' +
              '<a href="/crm/inquiries/" class="crm-viewlink">See all &rarr;</a>' +
            '</div>' +
            '<table><thead><tr><th>Received</th><th>From</th><th>Country</th><th>Asked for</th></tr></thead>' +
            '<tbody>' + rowsHtml + '</tbody></table>' +
            (list.length > recent.length
              ? '<p class="crm-muted" style="margin-bottom:0;">Showing the ' + recent.length +
                ' most recent.</p>'
              : '') +
          '</div>';
        }

        CRM.requireAuth().then(function () {
          CRM.renderNav('Dashboard');

          // Fetched separately and deliberately not chained: if the enquiries
          // call fails, the pipeline below must still render, and vice versa.
          CRM.fetchJson('/api/inquiries').then(function (res) {
            renderInbox(res.ok && Array.isArray(res.data) ? res.data : []);
          }).catch(function () { renderInbox([]); });

          return CRM.fetchJson('/api/crm/dashboard');
        }).then(function (result) {
          var d = result.data;
          var byStage = {};
          d.by_stage.forEach(function (s) { byStage[s.stage] = s.count; });
          var totalActive = d.by_stage.reduce(function (sum, s) { return sum + s.count; }, 0);

          var stageCardsHtml = CRM.STAGES.map(function (stage) {
            return '<div class="crm-stat"><div class="n">' + (byStage[stage] || 0) + '</div><div class="l">' + CRM.escapeHtml(stage) + '</div></div>';
          }).join('');

          var regionHtml = d.by_region.map(function (r) {
            return '<div class="crm-stat"><div class="n">' + r.count + '</div><div class="l">' + CRM.escapeHtml(r.region) + '</div></div>';
          }).join('');

          var cr = d.conversion_rate;
          // Below SmallSample.MIN_SAMPLE the headline figure becomes the
          // count itself, because a percentage set in 22px type reads as a
          // measured rate and "33.3%" off three buyers is one buyer.
          var crBig = SmallSample.rate(cr.converted, cr.total, { noun: 'buyers' });
          var crNote = SmallSample.enough(cr.total)
            ? '(' + cr.converted + ' of ' + cr.total + ' buyers)'
            : SmallSample.note(cr.total, { noun: 'buyers' });

          /*
           * Pipeline order, not whatever order the database returned.
           *
           * The query groups by stage and has no ORDER BY on its outer select
           * -- the only one it carries is inside the window function, which
           * orders each buyer's own history so LEAD() can find the next
           * change. So the groups arrive in whatever order the aggregate
           * produced, which read as Sample Requested, Negotiation, Qualifying,
           * Lead, Contacted on the owner's screen and can differ between runs.
           *
           * stageOrderIndex has sat in this file since it was written, used by
           * nothing. Somebody meant to sort this table with it and never wired
           * it in.
           */
          var avgStageRows = d.avg_time_per_stage_days.slice().sort(function (a, b) {
            return stageOrderIndex(a.stage) - stageOrderIndex(b.stage);
          });

          /*
           * "Time spent in", not "time to reach".
           *
           * Each row of buyer_stage_history is a move TO a stage; LEAD() finds
           * when that buyer moved again, so the interval is how long they sat
           * in the stage they had just entered. The headings said the opposite
           * -- "Time to Reach Each Stage", "Avg. Days To Get There" -- which is
           * a different question with a different answer. One tells you your
           * cycle length, the other tells you where deals stall.
           *
           * Only stages somebody has LEFT appear: the query drops rows with no
           * next change, so whatever stage a buyer sits in today is not counted
           * for them. That is correct, and the note says so, because a table
           * missing half the pipeline invites the reader to assume a bug.
           */
          var avgStageHtml = avgStageRows.length
            ? '<table><thead><tr><th>Stage</th><th>Avg. Days In Stage</th></tr></thead><tbody>' +
              avgStageRows.map(function (r) {
                return '<tr><td>' + CRM.escapeHtml(r.stage) + '</td><td>' + r.avg_days + '</td></tr>';
              }).join('') + '</tbody></table>' +
              '<p class="crm-muted" style="margin-bottom:0;">Counts only stages a buyer has already moved on from, so the stage each buyer sits in today is not included.</p>'
            : '<p class="crm-muted">Not enough stage-change history yet to compute this.</p>';

          document.getElementById('dashboard-content').innerHTML =
            '<div class="crm-card"><h2>Buyers by Stage (' + totalActive + ' active)</h2><div class="crm-grid crm-grid-4">' + stageCardsHtml + '</div></div>' +
            '<div class="crm-card"><h2>By Region</h2><div class="crm-grid crm-grid-4">' + regionHtml + '</div></div>' +
            '<div class="crm-grid crm-grid-2">' +
              '<div class="crm-card"><h2>Overdue Follow-Ups (' + d.overdue_followups.length + ')</h2>' + renderFollowupList('Overdue', d.overdue_followups, 'None overdue.') + '</div>' +
              '<div class="crm-card"><h2>Upcoming (next 7 days) (' + d.upcoming_followups.length + ')</h2>' + renderFollowupList('Upcoming', d.upcoming_followups, 'Nothing due in the next 7 days.') + '</div>' +
            '</div>' +
            '<div class="crm-card"><h2>Stalled / Lost Leads (' + d.stalled_leads.length + ')</h2>' +
              (d.stalled_leads.length
                ? '<table><thead><tr><th>Company</th><th>Stage</th><th>Last Updated</th></tr></thead><tbody>' +
                  d.stalled_leads.map(function (r) {
                    return '<tr><td><a href="/crm/buyer/?id=' + r.id + '">' + CRM.escapeHtml(r.company_name) + '</a></td><td><span class="' + CRM.stageBadgeClass(r.current_stage) + '">' + CRM.escapeHtml(r.current_stage) + '</span></td><td>' + CRM.fmtDate(r.updated_at) + '</td></tr>';
                  }).join('') + '</tbody></table>'
                : '<p class="crm-muted">No stalled leads right now.</p>') +
            '</div>' +
            '<div class="crm-card"><h2>Conversion Rate</h2>' +
              '<p><strong style="font-size:22px;">' + CRM.escapeHtml(crBig) + '</strong> <span class="crm-muted">' + CRM.escapeHtml(crNote) + '</span></p>' +
              '<p class="crm-muted">' + CRM.escapeHtml(cr.definition) + '</p>' +
            '</div>' +
            '<div class="crm-card"><h2>Average Time Spent in Each Stage</h2>' + avgStageHtml + '</div>';
        }).catch(function (e) {
          if (e.message !== 'unauthorized') {
            document.getElementById('dashboard-content').innerHTML = '<div class="crm-status crm-status-error">Could not load dashboard data.</div>';
          }
        });
      })();
    </script>
  </body>
</html>
