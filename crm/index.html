<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Buyer CRM</title>
    <meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="/assets/crm.css" />
  <link rel="stylesheet" href="/assets/crm-ui.css" />
      <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#3f4f2b" />
  </head>
  <body>
    <div class="crm-container">
      <h1>Dashboard</h1>
      <!-- Today first (2026-10-20): what needs doing now, from the same two
           replies the rest of the page uses. Nothing here is fetched twice. -->
      <section class="crm-card crm-ui-today" id="today-card" aria-labelledby="today-title">
        <h2 id="today-title">Today</h2>
        <div class="crm-ui-today-grid">
          <div class="crm-ui-today-part" id="today-enquiries"><p class="crm-muted" role="status">Loading…</p></div>
          <div class="crm-ui-today-part" id="today-followups"><p class="crm-muted" role="status">Loading…</p></div>
        </div>
      </section>
      <!-- Enquiries first, because they are the only thing on this page that
           somebody outside the company is waiting on. Everything below is
           our own pipeline, which can wait a minute; a buyer who filled in
           the contact form cannot tell whether anyone has seen it. -->
      <div id="failures-card"></div>
      <div id="inbox-card"></div>

      <div id="dashboard-content">
        <p class="crm-muted">Loading…</p>
      </div>
    </div>
    <script src="/assets/small-sample.js"></script>
    <script src="/assets/crm.js"></script>
    <script>
      (function () {
        'use strict';

        function stageOrderIndex(stage) {
          var i = CRM.STAGES.indexOf(stage);
          return i === -1 ? CRM.STAGES.length : i;
        }

        function renderFollowupList(title, rows, emptyMsg) {
          if (!rows.length) return '<p class="crm-muted">' + emptyMsg + '</p>';
          var html = '<table><thead><tr><th>Company</th><th>Next Action</th><th>Due</th></tr></thead><tbody>';
          rows.forEach(function (r) {
            html += '<tr><td><a href="/crm/buyer/?id=' + r.id + '">' + CRM.escapeHtml(r.company_name) + '</a></td>' +
              '<td>' + CRM.escapeHtml(r.next_action || '') + '</td>' +
              '<td>' + CRM.fmtDate(r.next_action_due) + '</td></tr>';
          });
          html += '</tbody></table>';
          return html;
        }

        /* ---- Today ------------------------------------------------------- */
        // This browser's own date, as YYYY-MM-DD: "today" is the reader's day.
        function localDay(d) {
          return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
        }
        var todayStr = localDay(new Date());
        document.getElementById('today-title').textContent = 'Today \u00b7 ' + CRM.fmtDate(todayStr);

        function renderTodayEnquiries(list) {
          var el = document.getElementById('today-enquiries');
          if (list === null) { el.innerHTML = '<h3>New enquiries</h3><p class="crm-muted">Not loaded: see Enquiries below.</p>'; return; }
          var since = Date.now() - 24 * 3600 * 1000;
          var fresh = list.filter(function (r) { var t = Date.parse(r.created_at); return !isNaN(t) && t >= since; });
          var newest = list[0];
          var html = '<h3>New enquiries</h3>' +
            '<p class="crm-ui-today-n"><strong>' + fresh.length + '</strong> in the last 24 hours</p>';
          if (newest) {
            html += '<p class="crm-ui-today-line">Newest: <strong>' + CRM.escapeHtml(newest.company || newest.name || '(no name given)') + '</strong>' +
              (newest.country ? ' <span class="crm-muted">\u00b7 ' + CRM.escapeHtml(newest.country) + '</span>' : '') +
              ' <span class="crm-muted">\u00b7 ' + CRM.fmtDate(newest.created_at) + '</span></p>' +
              '<a class="crm-btn crm-btn-primary crm-ui-today-btn" href="/crm/inquiries/?open=e' + encodeURIComponent(newest.id) + '">Open newest enquiry</a>';
          } else {
            html += '<p class="crm-muted">Nothing received yet.</p>';
          }
          el.innerHTML = html;
        }

        /*
         * Follow-ups, split by the reader's own date. The server's overdue
         * and next-7-days lists are cut at the database's date (UTC), which
         * in Egypt is up to three hours behind, so both lists are merged and
         * re-sorted here: due before today, and due today.
         */
        function renderTodayFollowups(d) {
          var el = document.getElementById('today-followups');
          if (d === null) { el.innerHTML = '<h3>Follow-ups</h3><p class="crm-muted">Not loaded: see the banner below.</p>'; return; }
          var all = (d.overdue_followups || []).concat(d.upcoming_followups || []);
          var seen = {};
          all = all.filter(function (r) { if (seen[r.id]) return false; seen[r.id] = true; return true; });
          var day = function (r) { return String(r.next_action_due || '').slice(0, 10); };
          var overdue = all.filter(function (r) { return day(r) && day(r) < todayStr; });
          var dueToday = all.filter(function (r) { return day(r) === todayStr; });
          var list = overdue.concat(dueToday).slice(0, 6);
          var html = '<h3>Follow-ups</h3>' +
            '<p class="crm-ui-today-n"><strong>' + dueToday.length + '</strong> due today' +
            (overdue.length ? ' \u00b7 <strong class="crm-ui-today-late">' + overdue.length + '</strong> overdue' : '') + '</p>';
          if (list.length) {
            html += '<ul class="crm-ui-today-list">' + list.map(function (r) {
              var late = day(r) < todayStr;
              var meta = [r.next_action ? CRM.escapeHtml(r.next_action) : '',
                late ? '<span class="crm-ui-today-late">due ' + CRM.fmtDate(r.next_action_due) + '</span>' : 'due today'].filter(Boolean).join(' \u00b7 ');
              return '<li><a href="/crm/buyer/?id=' + encodeURIComponent(r.id) + '">' + CRM.escapeHtml(r.company_name) + '</a>' +
                '<span class="crm-ui-today-meta">' + meta + '</span></li>';
            }).join('') + '</ul>' +
            (overdue.length + dueToday.length > list.length ? '<p class="crm-muted" style="margin:0;">The rest are under Overdue Follow-Ups below.</p>' : '');
          } else {
            html += '<p class="crm-muted">Nothing due today.</p>';
          }
          el.innerHTML = html;
        }

        function renderInbox(list) {
          var card = document.getElementById('inbox-card');
          if (!list.length) {
            card.innerHTML = '<div class="crm-card"><h2>Enquiries</h2>' +
              '<p class="crm-muted">Nothing received yet. Enquiries from the website\u2019s ' +
              'contact and sample forms appear here.</p></div>';
            return;
          }
          var recent = list.slice(0, 5);
          var rowsHtml = recent.map(function (r) {
            return '<tr>' +
              '<td>' + CRM.fmtDate(r.created_at) + '</td>' +
              '<td><strong>' + CRM.escapeHtml(r.company || r.name || '(no name given)') + '</strong></td>' +
              '<td>' + CRM.escapeHtml(r.country || '') + '</td>' +
              '<td>' + CRM.escapeHtml(r.request_type || 'Enquiry') + '</td>' +
              '</tr>';
          }).join('');
          card.innerHTML = '<div class="crm-card">' +
            '<div class="crm-flex-between" style="margin-bottom:10px;">' +
              '<h2 style="margin:0;">Enquiries (' + list.length + ')</h2>' +
              '<a href="/crm/inquiries/" class="crm-viewlink">See all &rarr;</a>' +
            '</div>' +
            '<table><thead><tr><th>Received</th><th>From</th><th>Country</th><th>Asked for</th></tr></thead>' +
            '<tbody>' + rowsHtml + '</tbody></table>' +
            (list.length > recent.length
              ? '<p class="crm-muted" style="margin-bottom:0;">Showing the ' + recent.length +
                ' most recent.</p>'
              : '') +
          '</div>';
        }

        /*
         * Something failed. Every CRM failure was already written to Netlify's
         * function log, and nobody reads that unprompted -- which is how
         * eighteen broken calls ran for three and a half weeks in September.
         * Recorded failures from the last seven days are shown here, above
         * everything else, until they age out. See _failure_lib.js.
         */
        var FAILURE_PLACES = {
          'crm-buyers': 'Buyers', 'crm-activity': 'Activity notes', 'crm-documents': 'Documents',
          'crm-csv': 'CSV import/export', 'crm-dashboard': 'Dashboard', 'crm-data-quality': 'Review names', 'crm-page': 'A CRM page',
          'crm-auth-login': 'Sign-in', 'crm-auth-forgot': 'Forgot password', 'crm-auth-reset': 'Password reset',
          'inquiries': 'Website enquiries', 'leads': 'Guide downloads'
        };
        // When no step was recorded, say what kind of action it was -- greyed,
        // because it is inferred from the request, not recorded.
        var FAILURE_ACTIONS = { GET: 'loading', POST: 'creating or sending', PATCH: 'saving a change', DELETE: 'deleting' };
        function renderFailures(f) {
          var el = document.getElementById('failures-card');
          if (!f || !f.count) { el.innerHTML = ''; return; }
          el.innerHTML = '<div class="crm-card crm-failures">' +
            '<h2>Something failed: ' + f.count + (f.count === 1 ? ' operation' : ' operations') + ' in the last ' + f.days + ' days</h2>' +
            '<p class="crm-muted">Each one is also in the Netlify function log with full detail. ' +
            (f.count > f.latest.length ? 'The ' + f.latest.length + ' most recent:' : '') + '</p>' +
            '<table><thead><tr><th>When</th><th>Where</th><th>While</th><th>Error</th></tr></thead><tbody>' +
            f.latest.map(function (r) {
              return '<tr><td>' + CRM.fmtDate(r.occurred_at) + '</td>' +
                '<td>' + CRM.escapeHtml(FAILURE_PLACES[r.source] || r.source) + (r.method ? ' <span class="crm-muted">' + CRM.escapeHtml(r.method) + '</span>' : '') + '</td>' +
                '<td>' + (r.step ? CRM.escapeHtml(r.step)
                  : '<span class="crm-muted">' + CRM.escapeHtml(FAILURE_ACTIONS[r.method] || '') + '</span>') + '</td>' +
                '<td>' + CRM.escapeHtml(r.message || '') + (r.code ? ' <span class="crm-muted">(' + CRM.escapeHtml(r.code) + ')</span>' : '') + '</td></tr>';
            }).join('') +
            '</tbody></table></div>';
        }

        /*
         * The enquiries box. A failed load said "Nothing received yet", which
         * is exactly the wrong thing to tell someone waiting on a buyer: it
         * now says it could not load them, with Retry.
         */
        function loadInbox() {
          var card = document.getElementById('inbox-card');
          card.innerHTML = '<div class="crm-card"><h2>Enquiries</h2><p class="crm-muted" role="status">Loading…</p></div>';
          CRM.fetchJson('/api/inquiries').then(function (res) {
            renderTodayEnquiries(res.ok && Array.isArray(res.data) ? res.data : null);
            if (!res.ok || !Array.isArray(res.data)) {
              card.innerHTML = '';
              CRM.loadError(card, { what: 'the latest enquiries', key: 'enquiries', error: res, retry: loadInbox });
              return;
            }
            renderInbox(res.data);
          }).catch(function (e) {
            renderTodayEnquiries(null);
            card.innerHTML = '';
            CRM.loadError(card, { what: 'the latest enquiries', key: 'enquiries', error: e, retry: loadInbox });
          });
        }

        function loadDashboard() {
          var content = document.getElementById('dashboard-content');
          content.innerHTML = '<p class="crm-muted" role="status">Loading…</p>';
          CRM.fetchJson('/api/crm/dashboard').then(function (result) {
            var good = result.ok && result.data && Array.isArray(result.data.by_stage);
            renderTodayFollowups(good ? result.data : null);
            if (!good) {
              content.innerHTML = '';
              CRM.loadError(content, { what: 'the pipeline figures', key: 'dashboard', error: result, retry: loadDashboard });
              return;
            }
            renderDashboard(result.data);
          }).catch(function (e) {
            renderTodayFollowups(null);
            content.innerHTML = '';
            CRM.loadError(content, { what: 'the pipeline figures', key: 'dashboard', error: e, retry: loadDashboard });
          });
        }

        CRM.requireAuth().then(function () {
          CRM.renderNav('Dashboard');
          // Separately, deliberately not chained: if one fails, the other still shows.
          loadInbox();
          loadDashboard();
        }).catch(function (e) {
          CRM.loadError(document.getElementById('dashboard-content'), { what: 'this page', key: 'dashboard', error: e, retry: function () { window.location.reload(); } });
        });

        function renderDashboard(d) {
          renderFailures(d && d.failures);
          var byStage = {};
          d.by_stage.forEach(function (s) { byStage[s.stage] = s.count; });
          var totalActive = d.by_stage.reduce(function (sum, s) { return sum + s.count; }, 0);

          var stageCardsHtml = CRM.STAGES.map(function (stage) {
            return '<div class="crm-stat"><div class="n">' + (byStage[stage] || 0) + '</div><div class="l">' + CRM.escapeHtml(stage) + '</div></div>';
          }).join('');

          var regionHtml = d.by_region.map(function (r) {
            return '<div class="crm-stat"><div class="n">' + r.count + '</div><div class="l">' + CRM.escapeHtml(r.region) + '</div></div>';
          }).join('');

          var cr = d.conversion_rate;
          // Below SmallSample.MIN_SAMPLE the headline figure becomes the
          // count itself, because a percentage set in 22px type reads as a
          // measured rate and "33.3%" off three buyers is one buyer.
          var crBig = SmallSample.rate(cr.converted, cr.total, { noun: 'buyers' });
          var crNote = SmallSample.enough(cr.total)
            ? '(' + cr.converted + ' of ' + cr.total + ' buyers)'
            : SmallSample.note(cr.total, { noun: 'buyers' });

          /*
           * Pipeline order, not whatever order the database returned.
           *
           * The query groups by stage and has no ORDER BY on its outer select
           * -- the only one it carries is inside the window function, which
           * orders each buyer's own history so LEAD() can find the next
           * change. So the groups arrive in whatever order the aggregate
           * produced, which read as Sample Requested, Negotiation, Qualifying,
           * Lead, Contacted on the owner's screen and can differ between runs.
           *
           * stageOrderIndex has sat in this file since it was written, used by
           * nothing. Somebody meant to sort this table with it and never wired
           * it in.
           */
          var avgStageRows = d.avg_time_per_stage_days.slice().sort(function (a, b) {
            return stageOrderIndex(a.stage) - stageOrderIndex(b.stage);
          });

          /*
           * "Time spent in", not "time to reach".
           *
           * Each row of buyer_stage_history is a move TO a stage; LEAD() finds
           * when that buyer moved again, so the interval is how long they sat
           * in the stage they had just entered. The headings said the opposite
           * -- "Time to Reach Each Stage", "Avg. Days To Get There" -- which is
           * a different question with a different answer. One tells you your
           * cycle length, the other tells you where deals stall.
           *
           * Only stages somebody has LEFT appear: the query drops rows with no
           * next change, so whatever stage a buyer sits in today is not counted
           * for them. That is correct, and the note says so, because a table
           * missing half the pipeline invites the reader to assume a bug.
           */
          var avgStageHtml = avgStageRows.length
            ? '<table><thead><tr><th>Stage</th><th>Avg. Days In Stage</th></tr></thead><tbody>' +
              avgStageRows.map(function (r) {
                return '<tr><td>' + CRM.escapeHtml(r.stage) + '</td><td>' + r.avg_days + '</td></tr>';
              }).join('') + '</tbody></table>' +
              '<p class="crm-muted" style="margin-bottom:0;">Counts only stages a buyer has already moved on from, so the stage each buyer sits in today is not included.</p>'
            : '<p class="crm-muted">Not enough stage-change history yet to compute this.</p>';

          /*
           * Lost/Stalled reasons: each move to Lost/Stalled, by the reason
           * chosen for it. Every category is listed, zero or not, so a reason
           * nobody gave still reads as 0 rather than going missing.
           */
          var lr = d.lost_reasons;
          var lostReasonsHtml;
          if (!lr) {
            lostReasonsHtml = '<p class="crm-muted">Not available yet. It appears once a buyer has been opened or saved since this update.</p>';
          } else {
            var counts = {};
            lr.rows.forEach(function (r) { counts[r.category] = r; });
            var reasonRows = CRM.LOST_CATEGORIES.map(function (c) { return [c[0], c[1]]; });
            if (counts.not_recorded) reasonRows.push(['not_recorded', 'Not recorded (moved before reasons were kept)']);
            var sumMonth = 0, sumAll = 0;
            lostReasonsHtml = '<table><thead><tr><th>Reason</th><th>This month</th><th>Overall</th></tr></thead><tbody>' +
              reasonRows.map(function (c) {
                var r = counts[c[0]] || { this_month: 0, overall: 0 };
                sumMonth += r.this_month; sumAll += r.overall;
                return '<tr><td>' + CRM.escapeHtml(c[1]) + '</td><td>' + r.this_month + '</td><td>' + r.overall + '</td></tr>';
              }).join('') +
              '</tbody><tfoot><tr><th scope="row">Total</th><td>' + sumMonth + '</td><td>' + sumAll + '</td></tr></tfoot></table>' +
              '<p class="crm-muted" style="margin-bottom:0;">Counts each move to Lost/Stalled, so a buyer moved there twice counts twice. This month is the calendar month, Cairo time. Deleted buyers are not counted.</p>';
          }

          document.getElementById('dashboard-content').innerHTML =
            '<div class="crm-card"><h2>Buyers by Stage (' + totalActive + ' active)</h2><div class="crm-grid crm-grid-4">' + stageCardsHtml + '</div></div>' +
            '<div class="crm-card"><h2>By Region</h2><div class="crm-grid crm-grid-4">' + regionHtml + '</div></div>' +
            '<div class="crm-grid crm-grid-2">' +
              '<div class="crm-card"><h2>Overdue Follow-Ups (' + d.overdue_followups.length + ')</h2>' + renderFollowupList('Overdue', d.overdue_followups, 'None overdue.') + '</div>' +
              '<div class="crm-card"><h2>Upcoming (next 7 days) (' + d.upcoming_followups.length + ')</h2>' + renderFollowupList('Upcoming', d.upcoming_followups, 'Nothing due in the next 7 days.') + '</div>' +
            '</div>' +
            '<div class="crm-card"><h2>Stalled / Lost Leads (' + d.stalled_leads.length + ')</h2>' +
              (d.stalled_leads.length
                ? '<table><thead><tr><th>Company</th><th>Stage</th><th>Last Updated</th></tr></thead><tbody>' +
                  d.stalled_leads.map(function (r) {
                    return '<tr><td><a href="/crm/buyer/?id=' + r.id + '">' + CRM.escapeHtml(r.company_name) + '</a></td><td><span class="' + CRM.stageBadgeClass(r.current_stage) + '">' + CRM.escapeHtml(r.current_stage) + '</span></td><td>' + CRM.fmtDate(r.updated_at) + '</td></tr>';
                  }).join('') + '</tbody></table>'
                : '<p class="crm-muted">No stalled leads right now.</p>') +
            '</div>' +
            '<div class="crm-card"><h2>Lost/Stalled Reasons</h2>' + lostReasonsHtml + '</div>' +
            '<div class="crm-card"><h2>Conversion Rate</h2>' +
              '<p><strong style="font-size:22px;">' + CRM.escapeHtml(crBig) + '</strong> <span class="crm-muted">' + CRM.escapeHtml(crNote) + '</span></p>' +
              '<p class="crm-muted">' + CRM.escapeHtml(cr.definition) + '</p>' +
            '</div>' +
            '<div class="crm-card"><h2>Average Time Spent in Each Stage</h2>' + avgStageHtml + '</div>';
        }
      })();
    </script>
  </body>
</html>
