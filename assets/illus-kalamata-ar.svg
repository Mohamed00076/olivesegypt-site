  <text x="450" y="610" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic', 'Amiri', 'Traditional Arabic', 'Geeza Pro', 'Arabic Typesetting', serif" font-size="40" fill="#f5f0e1">صورة المنتج قيد التجهيز</text>
