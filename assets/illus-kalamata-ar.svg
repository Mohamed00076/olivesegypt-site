    <ellipse cx="-15" cy="55" rx="24" ry="48" fill="#33253f" transform="rotate(5 -15 55)"/>
    <ellipse cx="-80" cy="-20" rx="10" ry="18" fill="#c9a84c" opacity="0.5" transform="rotate(-25 -80 -20)"/>
    <ellipse cx="0" cy="-55" rx="11" ry="19" fill="#c9a84c" opacity="0.5" transform="rotate(-8 0 -55)"/>
