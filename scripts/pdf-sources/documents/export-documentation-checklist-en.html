<div class="block"><h2>Prepared for every shipment</h2><div class="unit"><p class="body">Standard export documentation is prepared for every order:</p><ul class="list"><li>Commercial invoice</li><li>Packing list</li><li>Certificate of origin</li><li>Phytosanitary or health certificate</li><li>Bill of lading</li></ul></div></div>
<div class="block"><h2>Confirmed for your specific order</h2><div class="unit"><p class="body">These are confirmed in writing against your requirement before you commit to anything:</p><ul class="list"><li>Product specification sheet, for the varieties you are buying.</li><li>Caliber confirmation, from the published range for that variety.</li><li>Packaging specification — format, fill and pack configuration for your volume.</li><li>Label information — what your destination market requires on the label, and what we need from you.</li><li>Incoterm and lead time, for your port and volume.</li><li>Additional documents specific to your destination market’s requirements.</li></ul></div></div>
<div class="block"><h2>Duty, tariffs and HS classification</h2><p class="body">Import duty and tariff treatment — including the correct HS classification for table olives in your destination market — varies by country and can change. We recommend confirming the applicable HS code and duty rate with your own customs broker for your specific market rather than relying on a general figure. We would rather you got that from someone accountable for it in your jurisdiction.</p></div>
<div class="block"><h2>Still being established</h2><div class="unit"><p class="body">Stated plainly rather than left for you to discover:</p><ul class="list"><li><strong>Partner-facility certifications</strong> — being verified against the actual certificate documents. No certificate name, number, issuing body, scope or validity date appears on our site until that check is complete.</li><li><strong>Destination-market approvals</strong> — requirements differ by market and are confirmed per destination during quotation.</li><li><strong>Lot and shipment traceability detail</strong>, and the exact quality-check records supplied with a shipment — confirmed during quotation. We are a newly established export company and would rather agree these with you per order than describe a routine we have not yet run at scale.</li></ul></div></div>
<div class="block closing"><p class="note">Tell us your destination market and we will confirm exactly which documents apply.</p></div>

<script>
/*
 * The layout: the flow above, poured onto fixed A4 pages. A block that does
 * not fit splits between its items (the first part keeping the heading) or,
 * if not even its heading and first item fit, moves to the next page. An
 * item is never split. Runs again, from the start, whenever it is called:
 * the generator calls it once the PDF's own fonts are on.
 */
window.tcFit = () => {
  const tpl = (id) => document.getElementById(id).content;
  const pages = document.getElementById('pages');
  let body;
  const newPage = (first) => {
    const pg = document.createElement('section');
    pg.className = 'pdf-page doc-page';
    pg.appendChild(tpl(first ? 'page-one' : 'page-next').cloneNode(true));
    body = document.createElement('div');
    body.className = 'page-body';
    pg.appendChild(body);
    pg.appendChild(tpl('page-foot').cloneNode(true));
    pages.appendChild(pg);
  };
  const limit = () => body.parentElement.querySelector('.foot').getBoundingClientRect().top - 2;
  const fits = () => {
    const last = body.lastElementChild;
    return !last || last.getBoundingClientRect().bottom <= limit();
  };
  const layout = () => {
    pages.textContent = '';
    const place = (blk) => {
      body.appendChild(blk);
      if (fits()) return;
      if (blk.classList.contains('keep') && body.children.length > 1) {
        blk.remove();
        newPage(false);
        body.appendChild(blk);
        return;
      }
      const head = blk.querySelector(':scope > h2');
      const items = [...blk.children].filter((c) => c !== head);
      blk.remove();
      const part = blk.cloneNode(false);
      if (head) part.appendChild(head);
      body.appendChild(part);
      let i = 0;
      for (; i < items.length; i++) {
        part.appendChild(items[i]);
        if (!fits()) { items[i].remove(); break; }
      }
      if (i === 0) part.remove();
      if (i === items.length) return;
      const rest = blk.cloneNode(false);
      if (i === 0 && head) rest.appendChild(head); else rest.classList.add('cont');
      items.slice(i).forEach((it) => rest.appendChild(it));
      if (!body.children.length) { body.appendChild(rest); return; } // too tall for any page: the generator refuses it
      newPage(false);
      place(rest);
    };
    newPage(true);
    for (const blk of [...tpl('flow').cloneNode(true).children]) place(blk);
    // How full the last page is, from the top of its content to its foot.
    const top = body.getBoundingClientRect().top;
    const last = body.lastElementChild.getBoundingClientRect().bottom;
    return { count: pages.children.length, fill: (last - top) / (limit() - top) };
  };
  // One fixed type scale for every document (owner, 2026-10-13): a short
  // last page stays short rather than the type growing or shrinking to fill
  // it. Its fill is recorded for the report.
  //
  // One exception (owner, 2026-10-13): a document whose last page holds only
  // a few lines (under a quarter of the page) is laid out again with tighter
  // spacing between sections and items -- the type is never resized -- and
  // kept that way only if that removes the page.
  pages.classList.remove('tight');
  let result = layout();
  if (result.count > 1 && result.fill < 0.25) {
    const before = result.count;
    pages.classList.add('tight');
    result = layout();
    if (result.count >= before) { pages.classList.remove('tight'); result = layout(); }
  }
  document.documentElement.dataset.fill = result.fill.toFixed(2);
  document.documentElement.dataset.tight = pages.classList.contains('tight') ? '1' : '0';
  const all = pages.querySelectorAll('.pdf-page');
  all.forEach((pg, n) => { pg.querySelector('.pageno').textContent = (n + 1) + ' / ' + all.length; });
};
window.tcFit();
</script>
