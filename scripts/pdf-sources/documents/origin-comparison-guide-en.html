<div class="block"><h2>A Leading, Growing Origin</h2><p class="body">Egypt has quietly become one of the world's largest table-olive producers, and Africa's leading table-olive exporter, on the back of fertile Nile Delta and Fayoum growing regions, a long harvest window, and competitive FOB Alexandria pricing. Production has grown 45% over the past decade, reflecting sustained investment in the sector. We don't claim Egypt is the "best" origin for every buyer — the right origin depends on your variety, caliber, flavor profile, and price point — but it is a serious, scaling origin worth evaluating alongside any other.</p></div>
<div class="block"><h2>How Egyptian Olives Compare</h2><ul class="list"><li><strong>Variety range.</strong> Egypt grows both its own local olive cultivars and internationally known ones, giving buyers a way to source a familiar variety from a competitively priced, less saturated origin.</li><li><strong>Harvest timing.</strong> Egypt's autumn harvest window means fresh-season supply is available on a different calendar than some other Mediterranean origins — useful for buyers managing year-round inventory across multiple sourcing regions.</li><li><strong>Cost position.</strong> FOB Alexandria pricing is generally competitive relative to established Mediterranean origins, which is part of why global demand for Egyptian olives has grown. Exact competitiveness depends on your specific variety, caliber, and packaging — request a current quote to compare.</li><li><strong>Co-packing &amp; OEM capacity.</strong> Buyers looking for a contract packing or white-label olive manufacturer can work with our partner facility on private label formats across glass, tin, bucket, and barrel, with label design help available on request.</li></ul><p class="small">Industry figures above are sourced from FAO and International Olive Council (IOC) reporting on Egyptian production. Company-specific claims elsewhere on this site are kept separate and are not implied by these industry statistics.</p></div>

    pages.textContent = '';

      body.appendChild(blk);

      if (blk.classList.contains('keep') && body.children.length > 1) {

      for (; i < items.length; i++) {
