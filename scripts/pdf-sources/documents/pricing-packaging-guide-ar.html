<div class="block"><h2>ما الذي يحدّد السعر لكل كيلوغرام</h2><div class="unit"><p class="body">تتحرك أسعار زيتون المائدة مع الموسم، لذا لا ننشر قائمة أسعار ثابتة — فأي رقم مطبوع اليوم قد يكون غير دقيق عندما تقرؤه. فيما يلي العوامل الفعلية التي تحدّد السعر، وكيفية الحصول على عرض سعر حالي وصادق.</p><div class="cards"><div class="card"><h3>محصول الحصاد والطقس</h3><p>يمتد موسم حصاد الزيتون الرئيسي في مصر خلال فصل الخريف. يزيد المحصول القوي من المعروض ويخفّف الأسعار في الموسم الجديد؛ بينما يؤدي الجفاف أو عام غير موسمي (تتبع أشجار الزيتون نمطًا طبيعيًا لتحمل ثنائي السنوات) إلى تقييد التوفر.</p></div><div class="card"><h3>تحركات العملة</h3><p>يمكن أن تكون عروض الأسعار والدفع بالدولار الأمريكي أو اليورو. وقد تؤثر تحركات سعر صرف الجنيه المصري على الأسعار بين عرض سعر وآخر. تُدخل تقلبات العملة تغيرات قصيرة المدى تستحق المتابعة إذا كنت تخطط لتوقيت طلبك.</p></div><div class="card"><h3>الصنف والعيار</h3><p>يختلف السعر حسب المنتج والعيار والتغليف وحجم الطلب، ويُؤكَّد في عرض السعر.</p></div><div class="card"><h3>التغليف والشحن</h3><p>يكلّف الزجاج أكثر من البرميل بالجملة لكل وحدة؛ كما تؤثر أسعار الشحن البحري وتوفر الحاويات على تكلفتك النهائية حتى لو لم يتغيّر سعر التسليم على ظهر السفينة (FOB).</p></div></div></div><p class="body"><strong>مثال توضيحي</strong> (وليس عرض سعر): تخيّل مشتريًا يستورد زيتونًا أخضر، عيار <span dir="ltr">141/160</span>، بتغليف برميل بالجملة، لحاوية كاملة مقاس <span dir="ltr">20</span> قدمًا FOB الإسكندرية. ستعكس تكلفته النهائية لكل كيلوغرام سعر FOB الحالي لذلك العيار والتغليف، وأجرة الشحن البحري إلى ميناء وجهته، ورسوم الاستيراد في سوقه، وأي تكلفة إعادة تعبئة محلية. توضيحي فقط — وليس عرض سعر أو التزامًا ملزمًا. يعتمد سعر FOB الفعلي على الموسم الحالي ويُؤكَّد عند الطلب.</p></div>
<div class="block"><h2>صيغ التغليف التي نقدمها</h2><table class="spec doc-table"><thead><tr><th scope="col">الصيغة</th><th scope="col">الأحجام</th><th scope="col">العبوات في الكرتونة</th><th scope="col">القناة المعتادة</th></tr></thead> <tbody> <tr><th scope="row">برطمانات زجاجية</th><td><span dir="ltr">320</span> و<span dir="ltr">370</span> و<span dir="ltr">467</span> و<span dir="ltr">720</span> و<span dir="ltr">1050</span> مل</td><td><span dir="ltr">12</span> في الكرتونة حتى <span dir="ltr">720</span> مل؛ و<span dir="ltr">6</span> لحجم <span dir="ltr">1050</span> مل</td><td>التجزئة الفاخرة ومحلات الأطعمة الفاخرة</td></tr> <tr><th scope="row">علب صفيح</th><td><span dir="ltr">65</span> مم و<span dir="ltr">A9</span> و<span dir="ltr">A10</span> و<span dir="ltr">A12</span></td><td><span dir="ltr">12</span> لمقاس <span dir="ltr">65</span> مم؛ و<span dir="ltr">6</span> لمقاسي <span dir="ltr">A9</span> و<span dir="ltr">A10</span>؛ و<span dir="ltr">4</span> لمقاس <span dir="ltr">A12</span></td><td>خدمات الأغذية، والتصدير للمناخات الحارة، وخطوط الزيتون الأسود المؤكسد</td></tr> <tr><th scope="row">دِلاء بلاستيكية (درجة غذائية)</th><td><span dir="ltr">2</span> و<span dir="ltr">5</span> و<span dir="ltr">10</span> و<span dir="ltr">20</span> كجم</td><td>تؤكد أثناء عرض السعر</td><td>المطاعم ومقدمو خدمات التموين وموزّعو التعبئة</td></tr> <tr><th scope="row">براميل بلاستيكية</th><td><span dir="ltr">220</span> كجم</td><td>تؤكد أثناء عرض السعر</td><td>نضج ونقل المحلول الملحي بالجملة، لأقل تكلفة لكل كيلوغرام على الكميات الكبيرة</td></tr> </tbody></table><p class="body">هذه هي صيغ التغليف المؤكَّد توفرها فعليًا. تُؤكَّد الأحجام الدقيقة، وتشكيلات الكراتين، والحد الأدنى للكميات لكل صيغة أثناء عرض السعر، وتعتمد على المنتج المحدد وحجم الطلب.</p></div>
<div class="block"><h2>فهم تصنيف العيار</h2><p class="body">يُصنَّف زيتون المائدة حسب العيار — عدد حبات الزيتون لكل كيلوغرام، مكتوبًا كنطاق مثل <span dir="ltr">181/200</span>. الرقم الأصغر يعني حبات زيتون أكبر. نوفّر أعيرة من <span dir="ltr">140</span> إلى <span dir="ltr">360</span>، ويُؤكَّد عيار طلبك في عرض السعر. نطاقات العيار الدقيقة المتاحة لكل صنف مُدرَجة في كتالوج المنتجات وصفحة كل منتج على حدة.</p></div>
<div class="block"><h2>التغليف بالعلامة الخاصة و OEM</h2><p class="body">علامتك التجارية، وتصميم تغليفك، ومنتجنا الجاهز للتصدير. ندعم التغليف بالعلامة الخاصة عبر صيغ الزجاج والصفيح والدِلاء والبراميل، متولّين الطباعة والتعبئة ومستندات التصدير. ويمكننا المساعدة في تصميم الملصق عند الطلب. يُؤكَّد الحد الأدنى للكمية، ومواصفات التصميم الفني، ومتطلبات الملصقات للتغليف بالعلامة الخاصة والمخصص لكل مشروع على حدة أثناء عرض السعر، حيث تعتمد على الصيغة وطريقة الطباعة والحجم الذي تحتاجه.</p></div>
<div class="block"><h2>ما الذي تخبرنا به لعرض السعر</h2><div class="unit"><p class="body">أخبرنا بما يلي، وسنؤكد لك سعرًا حاليًا وصادقًا وفق هذه الشروط بالتحديد بدلًا من نطاق عام:</p><ul class="list"><li>نوع المنتج وشكله (أخضر، أخضر محشو، أسود طبيعي، أسود مؤكسد؛ كامل أو منزوع النواة أو مقطع) والعيار</li><li>أي صنف زراعي محدد (يتم التحقق من توفره لكل طلب)</li><li>صيغة التغليف</li><li>حجم الطلب المستهدف</li><li>ميناء الوجهة</li><li>الحد التجاري (Incoterm): FOB أو CIF أو CFR</li></ul></div></div>
<div class="block closing"><p class="note">تُؤكَّد خيارات التغليف الدقيقة، ومواصفات المحلول الملحي، والأسعار أثناء عرض السعر للمنتج المحدد وحجم الطلب.</p></div>

<main id="pages"></main>
<script>
/*
 * The layout: the flow above, poured onto fixed A4 pages. A block that does
 * not fit splits between its items (the first part keeping the heading) or,
 * if not even its heading and first item fit, moves to the next page. An
 * item is never split. Runs again, from the start, whenever it is called:
 * the generator calls it once the PDF's own fonts are on.
 */
window.tcFit = () => {
  const tpl = (id) => document.getElementById(id).content;
  const pages = document.getElementById('pages');
  let body;
  const newPage = (first) => {
    const pg = document.createElement('section');
    pg.className = 'pdf-page doc-page';
    pg.appendChild(tpl(first ? 'page-one' : 'page-next').cloneNode(true));
    body = document.createElement('div');
    body.className = 'page-body';
    pg.appendChild(body);
    pg.appendChild(tpl('page-foot').cloneNode(true));
    pages.appendChild(pg);
  };
  const limit = () => body.parentElement.querySelector('.foot').getBoundingClientRect().top - 2;
  const fits = () => {
    const last = body.lastElementChild;
    return !last || last.getBoundingClientRect().bottom <= limit();
  };
  const layout = () => {
    pages.textContent = '';
    const place = (blk) => {
      body.appendChild(blk);
      if (fits()) return;
      if (blk.classList.contains('keep') && body.children.length > 1) {
        blk.remove();
        newPage(false);
        body.appendChild(blk);
        return;
      }
      const head = blk.querySelector(':scope > h2');
      const items = [...blk.children].filter((c) => c !== head);
      blk.remove();
      const part = blk.cloneNode(false);
      if (head) part.appendChild(head);
      body.appendChild(part);
      let i = 0;
      for (; i < items.length; i++) {
        part.appendChild(items[i]);
        if (!fits()) { items[i].remove(); break; }
      }
      if (i === 0) part.remove();
      if (i === items.length) return;
      const rest = blk.cloneNode(false);
      if (i === 0 && head) rest.appendChild(head); else rest.classList.add('cont');
      items.slice(i).forEach((it) => rest.appendChild(it));
      if (!body.children.length) { body.appendChild(rest); return; } // too tall for any page: the generator refuses it
      newPage(false);
      place(rest);
    };
    newPage(true);
    for (const blk of [...tpl('flow').cloneNode(true).children]) place(blk);
    // How full the last page is, from the top of its content to its foot.
    const top = body.getBoundingClientRect().top;
    const last = body.lastElementChild.getBoundingClientRect().bottom;
    return { count: pages.children.length, fill: (last - top) / (limit() - top) };
  };
  // One fixed type scale for every document (owner, 2026-10-13): a short
  // last page stays short rather than the type growing or shrinking to fill
  // it. Its fill is recorded for the report.
  const result = layout();
  document.documentElement.dataset.fill = result.fill.toFixed(2);
  const all = pages.querySelectorAll('.pdf-page');
  all.forEach((pg, n) => { pg.querySelector('.pageno').textContent = (n + 1) + ' / ' + all.length; });
};
window.tcFit();
</script>
