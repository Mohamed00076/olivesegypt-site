<div class="block"><h2>ما الذي يحدّد السعر لكل كيلوغرام</h2><div class="unit"><p class="body">تتحرك أسعار زيتون المائدة مع الموسم، لذا لا ننشر قائمة أسعار ثابتة — فأي رقم مطبوع اليوم قد يكون غير دقيق عندما تقرؤه. فيما يلي العوامل الفعلية التي تحدّد السعر، وكيفية الحصول على عرض سعر حالي وصادق.</p><div class="cards"><div class="card"><h3>محصول الحصاد والطقس</h3><p>يمتد موسم حصاد الزيتون الرئيسي في مصر خلال فصل الخريف. يزيد المحصول القوي من المعروض ويخفّف الأسعار في الموسم الجديد؛ بينما يؤدي الجفاف أو عام غير موسمي (تتبع أشجار الزيتون نمطًا طبيعيًا لتحمل ثنائي السنوات) إلى تقييد التوفر.</p></div><div class="card"><h3>تحركات العملة</h3><p>يمكن أن تكون عروض الأسعار والدفع بالدولار الأمريكي أو اليورو. وقد تؤثر تحركات سعر صرف الجنيه المصري على الأسعار بين عرض سعر وآخر. تُدخل تقلبات العملة تغيرات قصيرة المدى تستحق المتابعة إذا كنت تخطط لتوقيت طلبك.</p></div><div class="card"><h3>الصنف والعيار</h3><p>يختلف السعر حسب المنتج والعيار والتغليف وحجم الطلب، ويُؤكَّد في عرض السعر.</p></div><div class="card"><h3>التغليف والشحن</h3><p>يكلّف الزجاج أكثر من البرميل بالجملة لكل وحدة؛ كما تؤثر أسعار الشحن البحري وتوفر الحاويات على تكلفتك النهائية حتى لو لم يتغيّر سعر التسليم على ظهر السفينة (FOB).</p></div></div></div><p class="body"><strong>مثال توضيحي</strong> (وليس عرض سعر): تخيّل مشتريًا يستورد زيتونًا أخضر، عيار <span dir="ltr">141/160</span>، بتغليف برميل بالجملة، لحاوية كاملة مقاس <span dir="ltr">20</span> قدمًا FOB الإسكندرية. ستعكس تكلفته النهائية لكل كيلوغرام سعر FOB الحالي لذلك العيار والتغليف، وأجرة الشحن البحري إلى ميناء وجهته، ورسوم الاستيراد في سوقه، وأي تكلفة إعادة تعبئة محلية. توضيحي فقط — وليس عرض سعر أو التزامًا ملزمًا. يعتمد سعر FOB الفعلي على الموسم الحالي ويُؤكَّد عند الطلب.</p></div>
<div class="block"><h2>صيغ التغليف التي نقدمها</h2><table class="spec doc-table"><thead><tr><th scope="col">الصيغة</th><th scope="col">الأحجام</th><th scope="col">العبوات في الكرتونة</th><th scope="col">القناة المعتادة</th></tr></thead> <tbody> <tr><th scope="row"><span class="row-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="7" y="2.5" width="10" height="3" rx="1"/><path d="M7.5 5.5h9l1 3v11a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2v-11z"/><path d="M6.5 11h11"/><circle cx="12" cy="15.5" r="2"/></svg></span>برطمانات زجاجية</th><td><span dir="ltr">320</span> و<span dir="ltr">370</span> و<span dir="ltr">467</span> و<span dir="ltr">720</span> و<span dir="ltr">1050</span> مل</td><td><span dir="ltr">12</span> في الكرتونة حتى <span dir="ltr">720</span> مل؛ و<span dir="ltr">6</span> لحجم <span dir="ltr">1050</span> مل</td><td>التجزئة ومحلات الأطعمة الفاخرة</td></tr> <tr><th scope="row"><span class="row-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><ellipse cx="12" cy="5" rx="7" ry="2.5"/><path d="M5 5v14c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V5"/><path d="M5 9.5c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/></svg></span>علب صفيح</th><td><span dir="ltr">65</span> مم و<span dir="ltr">A9</span> و<span dir="ltr">A10</span> و<span dir="ltr">A12</span></td><td><span dir="ltr">12</span> لمقاس <span dir="ltr">65</span> مم؛ و<span dir="ltr">6</span> لمقاسي <span dir="ltr">A9</span> و<span dir="ltr">A10</span>؛ و<span dir="ltr">4</span> لمقاس <span dir="ltr">A12</span></td><td>خدمات الأغذية، والتصدير للمناخات الحارة، وخطوط الزيتون الأسود المؤكسد</td></tr> <tr><th scope="row"><span class="row-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 7h15l-1.6 13a1.5 1.5 0 0 1-1.5 1.3H7.6A1.5 1.5 0 0 1 6.1 20z"/><path d="M4.5 7c0-2.8 3.4-4.5 7.5-4.5s7.5 1.7 7.5 4.5"/><path d="M8 12.5h8"/></svg></span>دِلاء بلاستيكية (درجة غذائية)</th><td><span dir="ltr">2</span> و<span dir="ltr">5</span> و<span dir="ltr">10</span> و<span dir="ltr">20</span> كجم</td><td>تؤكد أثناء عرض السعر</td><td>المطاعم ومقدمو خدمات التموين وموزّعو التعبئة</td></tr> <tr><th scope="row"><span class="row-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="4" width="14" height="3" rx="1"/><path d="M6 7h12l-1 13a1.5 1.5 0 0 1-1.5 1.4h-7A1.5 1.5 0 0 1 7 20z"/><path d="M9 11.5h6"/></svg></span>وعاء PET</th><td><span dir="ltr">4</span> كجم</td><td><span dir="ltr">4</span> في الكرتونة</td><td>للفلفل الهالبينو المقطّع فقط</td></tr> <tr><th scope="row"><span class="row-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3h12c1.3 2.6 2 5.6 2 9s-.7 6.4-2 9H6c-1.3-2.6-2-5.6-2-9s.7-6.4 2-9z"/><path d="M4.4 8h15.2"/><path d="M4.4 16h15.2"/></svg></span>براميل بلاستيكية</th><td><span dir="ltr">220</span> كجم</td><td>تؤكد أثناء عرض السعر</td><td>نضج ونقل المحلول الملحي بالجملة، لأقل تكلفة لكل كيلوغرام على الكميات الكبيرة</td></tr> </tbody></table><p class="body">هذه هي صيغ التغليف المؤكَّد توفرها فعليًا. تُؤكَّد الأحجام الدقيقة، وتشكيلات الكراتين، والحد الأدنى للكميات لكل صيغة أثناء عرض السعر، وتعتمد على المنتج المحدد وحجم الطلب.</p></div>
<div class="block"><h2>فهم تصنيف العيار</h2><p class="body">يُصنَّف زيتون المائدة حسب العيار — عدد حبات الزيتون لكل كيلوغرام، مكتوبًا كنطاق مثل <span dir="ltr">181/200</span>. الرقم الأصغر يعني حبات زيتون أكبر. نوفّر أعيرة من <span dir="ltr">140</span> إلى <span dir="ltr">360</span>، ويُؤكَّد عيار طلبك في عرض السعر. نطاقات العيار الدقيقة المتاحة لكل صنف مُدرَجة في كتالوج المنتجات وصفحة كل منتج على حدة.</p><figure class="caliber-scale">
<svg viewBox="0 0 229.2 44" aria-hidden="true" focusable="false"><g fill="#8fa86a" stroke="#4c5926" stroke-width="1.2"><ellipse cx="33" cy="22" rx="15" ry="17.7"/><ellipse cx="70" cy="22" rx="13" ry="15.3"/><ellipse cx="103" cy="22" rx="11" ry="13.0"/><ellipse cx="132.5" cy="22" rx="9.5" ry="11.2"/><ellipse cx="159" cy="22" rx="8" ry="9.4"/><ellipse cx="182.8" cy="22" rx="6.8" ry="8.0"/><ellipse cx="204.4" cy="22" rx="5.8" ry="6.8"/></g></svg>

</figure></div>
<div class="block"><h2>التغليف بالعلامة الخاصة و OEM</h2><p class="body">علامتك التجارية، وتصميم تغليفك، ومنتجنا الجاهز للتصدير. ندعم التغليف بالعلامة الخاصة عبر صيغ الزجاج والصفيح والدِلاء والبراميل، متولّين الطباعة والتعبئة ومستندات التصدير. ويمكننا المساعدة في تصميم الملصق عند الطلب. يُؤكَّد الحد الأدنى للكمية، ومواصفات التصميم الفني، ومتطلبات الملصقات للتغليف بالعلامة الخاصة والمخصص لكل مشروع على حدة أثناء عرض السعر، حيث تعتمد على الصيغة وطريقة الطباعة والحجم الذي تحتاجه.</p></div>
<div class="block"><h2>ما الذي تخبرنا به لعرض السعر</h2><div class="unit"><p class="body">أخبرنا بما يلي، وسنؤكد لك سعرًا حاليًا وصادقًا وفق هذه الشروط بالتحديد بدلًا من نطاق عام:</p><ul class="list"><li>نوع المنتج وشكله (أخضر، أخضر محشو، أسود طبيعي، أسود مؤكسد؛ كامل أو منزوع النواة أو مقطع) والعيار</li><li>أي صنف زراعي محدد (يتم التحقق من توفره لكل طلب)</li><li>صيغة التغليف</li><li>حجم الطلب المستهدف</li><li>ميناء الوجهة</li><li>الحد التجاري (Incoterm): FOB أو CIF أو CFR</li></ul></div></div>
<div class="block closing"><p class="note">تُؤكَّد خيارات التغليف الدقيقة، ومواصفات المحلول الملحي، والأسعار أثناء عرض السعر للمنتج المحدد وحجم الطلب.</p></div>

<script>
/*
 * The layout: the flow above, poured onto fixed A4 pages. A block that does
 * not fit splits between its items (the first part keeping the heading) or,
 * if not even its heading and first item fit, moves to the next page. An
 * item is never split. Runs again, from the start, whenever it is called:
 * the generator calls it once the PDF's own fonts are on.
 */
window.tcFit = () => {
  const tpl = (id) => document.getElementById(id).content;
  const pages = document.getElementById('pages');
  let body;
  const newPage = (first) => {
    const pg = document.createElement('section');
    pg.className = 'pdf-page doc-page';
    pg.appendChild(tpl(first ? 'page-one' : 'page-next').cloneNode(true));
    body = document.createElement('div');
    body.className = 'page-body';
    pg.appendChild(body);
    pg.appendChild(tpl('page-foot').cloneNode(true));
    pages.appendChild(pg);
  };
  // Content stops at least 3 mm (11px) above the foot's rule.
  const limit = () => body.parentElement.querySelector('.foot').getBoundingClientRect().top - 11;
  const fits = () => {
    const last = body.lastElementChild;
    return !last || last.getBoundingClientRect().bottom <= limit();
  };
  const layout = (breakBefore = -1) => {
    pages.textContent = '';
    const place = (blk) => {
      body.appendChild(blk);
      if (fits()) return;
      if (blk.classList.contains('keep') && body.children.length > 1) {
        blk.remove();
        newPage(false);
        body.appendChild(blk);
        return;
      }
      const head = blk.querySelector(':scope > h2');
      const items = [...blk.children].filter((c) => c !== head);
      blk.remove();
      const part = blk.cloneNode(false);
      if (head) part.appendChild(head);
      body.appendChild(part);
      let i = 0;
      for (; i < items.length; i++) {
        part.appendChild(items[i]);
        if (!fits()) { items[i].remove(); break; }
      }
      // A long list (class "long") that does not fit breaks between whole
      // points, at least two on each side; every other item moves whole.
      let broke = false;
      if (i < items.length) {
        const it = items[i];
        const ul = it.matches('ul.list.long') ? it : it.matches('.unit') ? it.querySelector(':scope > ul.list.long') : null;
        if (ul && ul.children.length >= 4) {
          const first = it.cloneNode(true);
          const firstUl = first.matches('ul') ? first : first.querySelector(':scope > ul');
          part.appendChild(first);
          // Leave at least two points for the next page, then take off more
          // until what stays fits, keeping at least two here.
          let k = ul.children.length;
          while (k > ul.children.length - 2) { firstUl.lastElementChild.remove(); k--; }
          while (k > 2 && !fits()) { firstUl.lastElementChild.remove(); k--; }
          if (fits() && ul.children.length - k >= 2) {
            const restUl = ul.cloneNode(false);
            restUl.classList.add('cont');
            [...ul.children].slice(k).forEach((li) => restUl.appendChild(li));
            items[i] = restUl;
            broke = true;
          } else first.remove();
        }
      }
      if (i === 0 && !broke) part.remove();
      if (i === items.length) return;
      const rest = blk.cloneNode(false);
      if (i === 0 && head && !broke) rest.appendChild(head); else rest.classList.add('cont');
      items.slice(i).forEach((it) => rest.appendChild(it));
      if (!body.children.length) { body.appendChild(rest); return; } // too tall for any page: the generator refuses it
      newPage(false);
      place(rest);
    };
    newPage(true);
    [...tpl('flow').cloneNode(true).children].forEach((blk, i) => {
      blk.dataset.i = i;
      if (i === breakBefore && body.children.length) newPage(false);
      place(blk);
    });
    // How full the last page is, from the top of its content to its foot.
    const top = body.getBoundingClientRect().top;
    const last = body.lastElementChild.getBoundingClientRect().bottom;
    return { count: pages.children.length, fill: (last - top) / (limit() - top) };
  };
  // One fixed type scale for every document (owner, 2026-10-13): a short
  // last page stays short rather than the type growing or shrinking to fill
  // it. Its fill is recorded for the report.
  //
  // No spacing is squeezed to save a page (owner, 2026-10-14: "a little bit
  // crowded"; the tighter-spacing pass that pulled a short last page back
  // was removed): room on the page comes before the page count.
  let result = layout();
  // A closing line never stands alone on the last page: the section before
  // it moves over to keep it company (it starts that page instead), as long
  // as that leaves something on the page it came from.
  const bodies = [...pages.querySelectorAll('.page-body')];
  const lastBody = bodies[bodies.length - 1];
  if (bodies.length > 1 && [...lastBody.children].every((c) => c.classList.contains('closing'))) {
    const prev = bodies[bodies.length - 2];
    const mover = prev.lastElementChild;
    if (mover && prev.children.length > 1 && mover.dataset.i !== undefined) result = layout(Number(mover.dataset.i));
  }
  document.documentElement.dataset.fill = result.fill.toFixed(2);
  const all = pages.querySelectorAll('.pdf-page');
  all.forEach((pg, n) => { pg.querySelector('.pageno').textContent = (n + 1) + ' / ' + all.length; });
};
window.tcFit();
</script>
