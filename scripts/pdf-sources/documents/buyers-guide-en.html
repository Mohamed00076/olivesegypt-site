<div class="block"><h2>Frequently Asked Questions</h2><div class="qa"><h3>Do you own the processing facility?</h3><p class="body">No. We work with an approved partner arrangement for processing and storage. Triple Company handles sourcing, quality specification, sales, and export logistics; the physical processing and brining takes place at a partner facility in the 10th of Ramadan Industrial Zone.</p></div><div class="qa"><h3>Have you exported before?</h3><p class="body">We are a newly established export company actively developing our first international buyer relationships. We are direct about this because we would rather earn your trust with an honest first order than with an inflated track record.</p></div><div class="qa"><h3>What certifications apply?</h3><p class="body">Quality and documentation information is being prepared. Current product specifications and available documents can be requested by qualified buyers. Any certification we do publish will name the partner facility that holds it, together with the exact certificate name, number, and scope — not a general claim about Triple Company.</p></div><div class="qa"><h3>What is the MOQ?</h3><p class="body">Our current indicative minimum order is one 20ft container, approximately <span class="nb">16–18</span> metric tons. Smaller trial orders are not available; before you order, we can send a <span class="nb">1–5</span> kg sample of the variety, caliber and packaging you are evaluating. Exact MOQ for your order is confirmed during quotation.</p></div><div class="qa"><h3>Can I request a sample?</h3><p class="body">Yes. Samples are reserved for qualified B2B buyers — importers, distributors, retail chains, and food-service buyers. We typically send a representative <span class="nb">1–5</span> kg assortment of the variety, caliber, and packaging you're evaluating. We coordinate dispatch and customs paperwork to your destination port or door, and sample requests are confirmed within 24 hours by our export team.</p></div><div class="qa"><h3>What packaging is available?</h3><p class="body">Glass jars, tin cans, plastic buckets, and plastic barrels (for bulk brine), depending on the product and order volume — these are the packaging formats we have actually confirmed as available. Private-label and OEM packaging is available; artwork, labeling, and minimum quantities for custom packaging are confirmed per project.</p></div><div class="qa"><h3>Which markets are you targeting?</h3><p class="body">We are actively engaging buyers in Africa, the Middle East, and Asia. These are the markets we are building relationships in — not markets we currently serve with an established shipping history.</p></div><div class="qa"><h3>What documents do you provide?</h3><p class="body">Standard export documentation — commercial invoice, packing list, certificate of origin, phytosanitary or health certificate, and bill of lading — is prepared for every order. Additional documents specific to your destination market's requirements are confirmed during quotation.</p></div></div>
<div class="block"><h2>Export Markets We Are Targeting</h2><div class="unit"><p class="body">As a newly established export company, we are direct about where things stand: Triple Company has not yet completed an export shipment. The regions below are the markets we are actively targeting and building buyer relationships in. We will update this page as specific buyer relationships and shipments are confirmed.</p><ul class="list"><li><strong>Africa.</strong> Our home continent and a natural first market — shorter freight lanes, established trade relationships, and strong existing demand for Egyptian table olives across North and West Africa.</li><li><strong>Middle East.</strong> A region with deep cultural familiarity with cracked, brined, and marinated green olives, and strong retail and food-service demand for Egyptian green olives.</li><li><strong>Asia.</strong> A growing market for Mediterranean and Middle Eastern ingredients in retail, food service, and private label, with interest in competitively priced bulk and OEM supply.</li></ul></div><p class="body">Import duty and tariff treatment (including the correct HS classification for table olives in your destination market) varies by country and can change; we recommend confirming the applicable HS code and duty rate with your own customs broker for your specific market rather than relying on a general figure.</p></div>

<script>
/*
 * The layout: the flow above, poured onto fixed A4 pages. A block that does
 * not fit splits between its items (the first part keeping the heading) or,
 * if not even its heading and first item fit, moves to the next page. An
 * item is never split. Runs again, from the start, whenever it is called:
 * the generator calls it once the PDF's own fonts are on.
 */
window.tcFit = () => {
  const tpl = (id) => document.getElementById(id).content;
  const pages = document.getElementById('pages');
  let body;
  const newPage = (first) => {
    const pg = document.createElement('section');
    pg.className = 'pdf-page doc-page';
    pg.appendChild(tpl(first ? 'page-one' : 'page-next').cloneNode(true));
    body = document.createElement('div');
    body.className = 'page-body';
    pg.appendChild(body);
    pg.appendChild(tpl('page-foot').cloneNode(true));
    pages.appendChild(pg);
  };
  // Content stops at least 3 mm (11px) above the foot's rule.
  const limit = () => body.parentElement.querySelector('.foot').getBoundingClientRect().top - 11;
  const fits = () => {
    const last = body.lastElementChild;
    return !last || last.getBoundingClientRect().bottom <= limit();
  };
  const layout = (breakBefore = -1) => {
    pages.textContent = '';
    const place = (blk) => {
      body.appendChild(blk);
      if (fits()) return;
      if (blk.classList.contains('keep') && body.children.length > 1) {
        blk.remove();
        newPage(false);
        body.appendChild(blk);
        return;
      }
      const head = blk.querySelector(':scope > h2');
      const items = [...blk.children].filter((c) => c !== head);
      blk.remove();
      const part = blk.cloneNode(false);
      if (head) part.appendChild(head);
      body.appendChild(part);
      let i = 0;
      for (; i < items.length; i++) {
        part.appendChild(items[i]);
        if (!fits()) { items[i].remove(); break; }
      }
      // A long list (class "long") that does not fit breaks between whole
      // points, at least two on each side; every other item moves whole.
      let broke = false;
      if (i < items.length) {
        const it = items[i];
        const ul = it.matches('ul.list.long') ? it : it.matches('.unit') ? it.querySelector(':scope > ul.list.long') : null;
        if (ul && ul.children.length >= 4) {
          const first = it.cloneNode(true);
          const firstUl = first.matches('ul') ? first : first.querySelector(':scope > ul');
          part.appendChild(first);
          // Leave at least two points for the next page, then take off more
          // until what stays fits, keeping at least two here.
          let k = ul.children.length;
          while (k > ul.children.length - 2) { firstUl.lastElementChild.remove(); k--; }
          while (k > 2 && !fits()) { firstUl.lastElementChild.remove(); k--; }
          if (fits() && ul.children.length - k >= 2) {
            const restUl = ul.cloneNode(false);
            restUl.classList.add('cont');
            [...ul.children].slice(k).forEach((li) => restUl.appendChild(li));
            items[i] = restUl;
            broke = true;
          } else first.remove();
        }
      }
      if (i === 0 && !broke) part.remove();
      if (i === items.length) return;
      const rest = blk.cloneNode(false);
      if (i === 0 && head && !broke) rest.appendChild(head); else rest.classList.add('cont');
      items.slice(i).forEach((it) => rest.appendChild(it));
      if (!body.children.length) { body.appendChild(rest); return; } // too tall for any page: the generator refuses it
      newPage(false);
      place(rest);
    };
    newPage(true);
    [...tpl('flow').cloneNode(true).children].forEach((blk, i) => {
      blk.dataset.i = i;
      if (i === breakBefore && body.children.length) newPage(false);
      place(blk);
    });
    // How full the last page is, from the top of its content to its foot.
    const top = body.getBoundingClientRect().top;
    const last = body.lastElementChild.getBoundingClientRect().bottom;
    return { count: pages.children.length, fill: (last - top) / (limit() - top) };
  };
  // One fixed type scale for every document (owner, 2026-10-13): a short
  // last page stays short rather than the type growing or shrinking to fill
  // it. Its fill is recorded for the report.
  //
  // No spacing is squeezed to save a page (owner, 2026-10-14: "a little bit
  // crowded"; the tighter-spacing pass that pulled a short last page back
  // was removed): room on the page comes before the page count.
  let result = layout();
  // A closing line never stands alone on the last page: the section before
  // it moves over to keep it company (it starts that page instead), as long
  // as that leaves something on the page it came from.
  const bodies = [...pages.querySelectorAll('.page-body')];
  const lastBody = bodies[bodies.length - 1];
  if (bodies.length > 1 && [...lastBody.children].every((c) => c.classList.contains('closing'))) {
    const prev = bodies[bodies.length - 2];
    const mover = prev.lastElementChild;
    if (mover && prev.children.length > 1 && mover.dataset.i !== undefined) result = layout(Number(mover.dataset.i));
  }
  document.documentElement.dataset.fill = result.fill.toFixed(2);
  const all = pages.querySelectorAll('.pdf-page');
  all.forEach((pg, n) => { pg.querySelector('.pageno').textContent = (n + 1) + ' / ' + all.length; });
};
window.tcFit();
</script>
