<template id="flow">
<div class="block"><h2>الأسئلة الشائعة</h2><div class="qa"><h3>هل تمتلكون منشأة المعالجة؟</h3><p class="body">لا. نعمل من خلال ترتيب شراكة معتمد للمعالجة والتخزين. تتولى الشركة الثلاثية التوريد وتحديد مواصفات الجودة والمبيعات ولوجستيات التصدير، بينما تجري المعالجة الفعلية والتخليل في منشأة شريكة بمنطقة العاشر من رمضان الصناعية.</p></div><div class="qa"><h3>هل سبق لكم التصدير؟</h3><p class="body">نحن شركة تصدير حديثة التأسيس نعمل بفاعلية على بناء أولى علاقاتنا مع المشترين الدوليين. نصارحك بذلك لأننا نفضّل كسب ثقتك بطلب أول صادق بدلًا من سجل إنجازات مبالغ فيه.</p></div><div class="qa"><h3>ما هي الشهادات المعمول بها؟</h3><p class="body">يجري حاليًا إعداد معلومات الجودة والمستندات. يمكن للمشترين المؤهلين طلب مواصفات المنتج الحالية والمستندات المتاحة. أي شهادة ننشرها سنذكر فيها اسم المنشأة الشريكة الحاصلة عليها، مع الاسم والرقم والنطاق الدقيق للشهادة، وليس ادعاءً عامًا يخص الشركة الثلاثية.</p></div><div class="qa"><h3>ما هو الحد الأدنى للطلب (MOQ)؟</h3><p class="body">الحد الأدنى الاسترشادي الحالي لطلبنا هو حاوية واحدة مقاس <span dir="ltr">20</span> قدمًا، أي ما يقارب <span dir="ltr">16</span> إلى <span dir="ltr">18</span> طنًا متريًا. لا تتوفر طلبات تجريبية أصغر؛ ويمكننا قبل الطلب إرسال عينة من <span dir="ltr">1</span> إلى <span dir="ltr">5</span> كجم من الصنف والعيار والتغليف الذي تدرسه. يُؤكَّد الحد الأدنى الدقيق لطلبك أثناء عرض السعر.</p></div><div class="qa"><h3>هل يمكنني طلب عينة؟</h3><p class="body">نعم. العينات مخصصة للمشترين التجاريين المؤهلين: المستوردين والموزعين وسلاسل التجزئة ومشتري خدمات الأغذية. عادةً نرسل تشكيلة تمثيلية من <span dir="ltr">1</span> إلى <span dir="ltr">5</span> كجم من الصنف والعيار والتغليف الذي تقيّمه. ننسّق الشحن ومستندات الجمارك إلى ميناء أو باب وجهتك، ويؤكد فريق التصدير لدينا طلبات العينات خلال <span dir="ltr">24</span> ساعة.</p></div><div class="qa"><h3>ما خيارات التغليف المتاحة؟</h3><p class="body">برطمانات زجاجية، وعلب صفيح، ودِلاء بلاستيكية، وبراميل بلاستيكية (للمحلول الملحي بالجملة)، حسب المنتج وحجم الطلب — وهذه هي صيغ التغليف التي أكّدنا توفرها فعليًا. تتوفر خدمة التغليف بالعلامة الخاصة و OEM؛ ويُؤكَّد التصميم والملصقات والحد الأدنى للكميات الخاصة بالتغليف المخصص لكل مشروع على حدة.</p></div><div class="qa"><h3>ما هي الأسواق التي تستهدفونها؟</h3><p class="body">نتواصل بفاعلية مع مشترين في أفريقيا والشرق الأوسط وآسيا. هذه هي الأسواق التي نبني فيها علاقاتنا، وليست أسواقًا نخدمها حاليًا بسجل شحن راسخ.</p></div><div class="qa"><h3>ما المستندات التي تقدمونها؟</h3><p class="body">تُجهَّز مستندات التصدير القياسية لكل طلب: فاتورة تجارية، وقائمة تعبئة، وشهادة منشأ، وشهادة صحية أو نباتية، وبوليصة شحن. تُؤكَّد المستندات الإضافية الخاصة بمتطلبات سوق وجهتك أثناء عرض السعر.</p></div></div>
<div class="block"><h2>الأسواق التصديرية التي نستهدفها</h2><div class="unit"><p class="body">بصفتنا شركة تصدير حديثة التأسيس، نصارحك بموقعنا الحالي: لم تُكمِل الشركة الثلاثية بعد شحنة تصدير. المناطق أدناه هي الأسواق التي نستهدفها بفاعلية ونبني فيها علاقات المشترين. سنحدّث هذه الصفحة عند تأكيد علاقات محددة مع المشترين وشحنات فعلية.</p><ul class="list"><li><strong>أفريقيا.</strong> قارتنا الأم وسوقنا الأول الطبيعي — خطوط شحن أقصر، وعلاقات تجارية راسخة، وطلب قوي وقائم على زيتون المائدة المصري عبر شمال وغرب أفريقيا.</li><li><strong>الشرق الأوسط.</strong> منطقة ذات ألفة ثقافية عميقة بالزيتون المكسّر والمخلل بالمحلول الملحي والمتبّل، وطلب قوي في التجزئة وخدمات الأغذية على الزيتون الأخضر المصري.</li><li><strong>آسيا.</strong> سوق متنامية للمكونات المتوسطية والشرق أوسطية في التجزئة وخدمات الأغذية والعلامة الخاصة، مع اهتمام بالتوريد بالجملة و OEM بأسعار تنافسية.</li></ul></div><p class="body">تختلف معاملة رسوم الاستيراد والتعريفات الجمركية (بما في ذلك التصنيف الجمركي الصحيح (HS) لزيتون المائدة في سوق وجهتك) حسب الدولة ويمكن أن تتغير؛ نوصي بتأكيد رمز HS المعمول به ومعدل الرسوم مع وسيط الجمارك الخاص بك لسوقك المحدد بدلًا من الاعتماد على رقم عام.</p></div>

<main id="pages"></main>
<script>
/*
 * The layout: the flow above, poured onto fixed A4 pages. A block that does
 * not fit splits between its items (the first part keeping the heading) or,
 * if not even its heading and first item fit, moves to the next page. An
 * item is never split. Runs again, from the start, whenever it is called:
 * the generator calls it once the PDF's own fonts are on.
 */
window.tcFit = () => {
  const tpl = (id) => document.getElementById(id).content;
  const pages = document.getElementById('pages');
  let body;
  const newPage = (first) => {
    const pg = document.createElement('section');
    pg.className = 'pdf-page doc-page';
    pg.appendChild(tpl(first ? 'page-one' : 'page-next').cloneNode(true));
    body = document.createElement('div');
    body.className = 'page-body';
    pg.appendChild(body);
    pg.appendChild(tpl('page-foot').cloneNode(true));
    pages.appendChild(pg);
  };
  // Content stops at least 3 mm (11px) above the foot's rule.
  const limit = () => body.parentElement.querySelector('.foot').getBoundingClientRect().top - 11;
  const fits = () => {
    const last = body.lastElementChild;
    return !last || last.getBoundingClientRect().bottom <= limit();
  };
  const layout = (breakBefore = -1) => {
    pages.textContent = '';
    const place = (blk) => {
      body.appendChild(blk);
      if (fits()) return;
      if (blk.classList.contains('keep') && body.children.length > 1) {
        blk.remove();
        newPage(false);
        body.appendChild(blk);
        return;
      }
      const head = blk.querySelector(':scope > h2');
      const items = [...blk.children].filter((c) => c !== head);
      blk.remove();
      const part = blk.cloneNode(false);
      if (head) part.appendChild(head);
      body.appendChild(part);
      let i = 0;
      for (; i < items.length; i++) {
        part.appendChild(items[i]);
        if (!fits()) { items[i].remove(); break; }
      }
      // A long list (class "long") that does not fit breaks between whole
      // points, at least two on each side; every other item moves whole.
      let broke = false;
      if (i < items.length) {
        const it = items[i];
        const ul = it.matches('ul.list.long') ? it : it.matches('.unit') ? it.querySelector(':scope > ul.list.long') : null;
        if (ul && ul.children.length >= 4) {
          const first = it.cloneNode(true);
          const firstUl = first.matches('ul') ? first : first.querySelector(':scope > ul');
          part.appendChild(first);
          // Leave at least two points for the next page, then take off more
          // until what stays fits, keeping at least two here.
          let k = ul.children.length;
          while (k > ul.children.length - 2) { firstUl.lastElementChild.remove(); k--; }
          while (k > 2 && !fits()) { firstUl.lastElementChild.remove(); k--; }
          if (fits() && ul.children.length - k >= 2) {
            const restUl = ul.cloneNode(false);
            restUl.classList.add('cont');
            [...ul.children].slice(k).forEach((li) => restUl.appendChild(li));
            items[i] = restUl;
            broke = true;
          } else first.remove();
        }
      }
      if (i === 0 && !broke) part.remove();
      if (i === items.length) return;
      const rest = blk.cloneNode(false);
      if (i === 0 && head && !broke) rest.appendChild(head); else rest.classList.add('cont');
      items.slice(i).forEach((it) => rest.appendChild(it));
      if (!body.children.length) { body.appendChild(rest); return; } // too tall for any page: the generator refuses it
      newPage(false);
      place(rest);
    };
    newPage(true);
    [...tpl('flow').cloneNode(true).children].forEach((blk, i) => {
      blk.dataset.i = i;
      if (i === breakBefore && body.children.length) newPage(false);
      place(blk);
    });
    // How full the last page is, from the top of its content to its foot.
    const top = body.getBoundingClientRect().top;
    const last = body.lastElementChild.getBoundingClientRect().bottom;
    return { count: pages.children.length, fill: (last - top) / (limit() - top) };
  };
  // One fixed type scale for every document (owner, 2026-10-13): a short
  // last page stays short rather than the type growing or shrinking to fill
  // it. Its fill is recorded for the report.
  //
  // No spacing is squeezed to save a page (owner, 2026-10-14: "a little bit
  // crowded"; the tighter-spacing pass that pulled a short last page back
  // was removed): room on the page comes before the page count.
  let result = layout();
  // A closing line never stands alone on the last page: the section before
  // it moves over to keep it company (it starts that page instead), as long
  // as that leaves something on the page it came from.
  const bodies = [...pages.querySelectorAll('.page-body')];
  const lastBody = bodies[bodies.length - 1];
  if (bodies.length > 1 && [...lastBody.children].every((c) => c.classList.contains('closing'))) {
    const prev = bodies[bodies.length - 2];
    const mover = prev.lastElementChild;
    if (mover && prev.children.length > 1 && mover.dataset.i !== undefined) result = layout(Number(mover.dataset.i));
  }
  document.documentElement.dataset.fill = result.fill.toFixed(2);
  const all = pages.querySelectorAll('.pdf-page');
  all.forEach((pg, n) => { pg.querySelector('.pageno').textContent = (n + 1) + ' / ' + all.length; });
};
window.tcFit();
</script>
