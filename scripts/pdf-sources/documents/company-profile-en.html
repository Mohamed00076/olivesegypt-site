<div class="block"><h2>Our Story</h2><p class="body">Triple Company for Industrial Development is an Egyptian table-olive supplier based in Cairo, Egypt. We are preparing for international export of the approved product range for bulk, wholesale, food-service, retail, and private-label buyer discussions. As a newly established company, we are building our supply model through approved partner arrangements. Triple Company has invested in a dedicated brining line at our partner processing facility — now operational, as part of our ongoing investment in the facility&#x27;s capacity (approximately 2,000 metric tons total). Further equipment upgrades are planned at the facility, with Triple Company continuing to invest alongside our partner as the relationship grows. Product specifications, samples, packaging, documentation, MOQ, pricing, and delivery terms are confirmed according to the product and buyer request. We are actively developing buyer relationships and will confirm the applicable commercial and documentation requirements during quotation.</p></div>
<div class="block keep"><h2>Product Range</h2><div class="unit"><p class="body">Full specifications, calibers, and packaging options for each product are available on the product catalog.</p><ul class="list cols-2"><li>Green Olives</li><li>Stuffed Green Olives</li><li>Natural Black Olives</li><li>Oxidized Black Olives</li><li>Sliced Jalapeño Peppers</li><li>Marinated Artichoke Hearts</li><li>Pepperoncini Peppers</li></ul></div><p class="body">Packaging: glass jars, tin cans, plastic buckets, and plastic barrels (brine). Whole, pitted, sliced, and stuffed formats, subject to product. Private-label / OEM packaging available.</p></div>
<div class="block"><h2>Quality &amp; Documentation</h2><p class="body">Quality and documentation information is being prepared. Current product specifications and available documents can be requested by qualified buyers.</p></div>
<div class="block"><h2>Commercial Terms</h2><div class="facts"><div class="fact"><p class="label">Minimum order</p><p class="fact-value">1 × 20ft container (~<span class="nb">16–18</span> MT)</p></div><div class="fact"><p class="label">Incoterms</p><p class="fact-value">FOB Alexandria · CIF · CFR</p></div><div class="fact"><p class="label">Payment</p><p class="fact-value">30% T/T deposit · 70% vs B/L copy</p></div><div class="fact"><p class="label">Indicative lead time</p><p class="fact-value"><span class="nb">3–4</span> weeks, order to vessel</p></div><div class="fact"><p class="label">Samples</p><p class="fact-value"><span class="nb">1–5</span> kg assortment available on request</p></div><div class="fact"><p class="label">Currency</p><p class="fact-value">USD or EUR</p></div></div><p class="body">Terms shown are current and indicative; exact terms are confirmed during quotation for the specific product and order.</p></div>

/*
 * The layout: the flow above, poured onto fixed A4 pages. A block that does
 * not fit splits between its items (the first part keeping the heading) or,
 * if not even its heading and first item fit, moves to the next page. An
 * item is never split. Runs again, from the start, whenever it is called:
 * the generator calls it once the PDF's own fonts are on.
 */
window.tcFit = () => {
  const tpl = (id) => document.getElementById(id).content;
  const pages = document.getElementById('pages');
  let body;
  const newPage = (first) => {
    const pg = document.createElement('section');
    pg.className = 'pdf-page doc-page';
    pg.appendChild(tpl(first ? 'page-one' : 'page-next').cloneNode(true));
    body = document.createElement('div');
    body.className = 'page-body';
    pg.appendChild(body);
    pg.appendChild(tpl('page-foot').cloneNode(true));
    pages.appendChild(pg);
  };
  const limit = () => body.parentElement.querySelector('.foot').getBoundingClientRect().top - 2;
  const fits = () => {
    const last = body.lastElementChild;
    return !last || last.getBoundingClientRect().bottom <= limit();
  };
  const layout = () => {
    pages.textContent = '';
    const place = (blk) => {
      body.appendChild(blk);
      if (fits()) return;
      if (blk.classList.contains('keep') && body.children.length > 1) {
        blk.remove();
        newPage(false);
        body.appendChild(blk);
        return;
      }
      const head = blk.querySelector(':scope > h2');
      const items = [...blk.children].filter((c) => c !== head);
      blk.remove();
      const part = blk.cloneNode(false);
      if (head) part.appendChild(head);
      body.appendChild(part);
      let i = 0;
      for (; i < items.length; i++) {
        part.appendChild(items[i]);
        if (!fits()) { items[i].remove(); break; }
      }
      if (i === 0) part.remove();
      if (i === items.length) return;
      const rest = blk.cloneNode(false);
      if (i === 0 && head) rest.appendChild(head); else rest.classList.add('cont');
      items.slice(i).forEach((it) => rest.appendChild(it));
      if (!body.children.length) { body.appendChild(rest); return; } // too tall for any page: the generator refuses it
      newPage(false);
      place(rest);
    };
    newPage(true);
    for (const blk of [...tpl('flow').cloneNode(true).children]) place(blk);
    // How full the last page is, from the top of its content to its foot.
    const top = body.getBoundingClientRect().top;
    const last = body.lastElementChild.getBoundingClientRect().bottom;
    return { count: pages.children.length, fill: (last - top) / (limit() - top) };
  };
  // One fixed type scale for every document (owner, 2026-10-13): a short
  // last page stays short rather than the type growing or shrinking to fill
  // it. Its fill is recorded for the report.
  //
  // One exception (owner, 2026-10-13): a document whose last page holds only
  // a few lines (under a quarter of the page) is laid out again with tighter
  // spacing between sections and items -- the type is never resized -- and
  // kept that way only if that removes the page.
  pages.classList.remove('tight');
  let result = layout();
  if (result.count > 1 && result.fill < 0.25) {
    const before = result.count;
    pages.classList.add('tight');
    result = layout();
    if (result.count >= before) { pages.classList.remove('tight'); result = layout(); }
  }
  document.documentElement.dataset.fill = result.fill.toFixed(2);
  document.documentElement.dataset.tight = pages.classList.contains('tight') ? '1' : '0';
  const all = pages.querySelectorAll('.pdf-page');
  all.forEach((pg, n) => { pg.querySelector('.pageno').textContent = (n + 1) + ' / ' + all.length; });
};
window.tcFit();
</script>
