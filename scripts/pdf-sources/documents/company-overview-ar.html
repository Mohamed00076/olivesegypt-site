<div class="block"><h2>من نحن</h2><p class="body">الشركة الثلاثية للتنمية الصناعية شركة مصرية حديثة التأسيس لتصدير زيتون المائدة، مقرّها ميدان العروبة، التجمع الخامس، القاهرة الجديدة، القاهرة، مصر. ونعمل بفاعلية على بناء أولى علاقاتنا مع المشترين الدوليين. نصارحك بذلك لأننا نفضّل كسب ثقتك بطلب أول صادق بدلًا من سجل إنجازات مبالغ فيه.</p></div>
<div class="block"><h2>كيف نعمل</h2><div class="unit"><p class="body">نحن لا نمتلك منشأة المعالجة. نعمل من خلال ترتيب شراكة معتمد للمعالجة والتخزين: تتولى الشركة الثلاثية للتنمية الصناعية التوريد وتحديد مواصفات الجودة والمبيعات ولوجستيات التصدير، بينما تجري المعالجة الفعلية والتخليل في منشأة شريكة بمنطقة العاشر من رمضان الصناعية.</p><ul class="list"><li><strong>ما نتولاه</strong> — التوريد واختيار الدفعات، وتحديد مواصفات المنتج، والتواصل مع المشتري والشروط التجارية، وتنسيق التصدير والمناولة في الميناء، وحزمة مستندات التصدير.</li><li><strong>ما تتولاه المنشأة الشريكة المعتمدة</strong> — المعالجة والتخليل، والتصنيف على العيار المتفق عليه، والتعبئة والتغليف، ووضع الملصقات وفق التصميم المعتمد، وحيازة ما لديها من شهادات باسمها هي.</li></ul></div></div>
<div class="block"><h2>تشكيلة المنتجات</h2><div class="unit"><p class="body">سبعة منتجات في ثلاث مجموعات.</p><ul class="list"><li><strong>زيتون أخضر</strong> — زيتون أخضر، وزيتون أخضر محشو.</li><li><strong>زيتون أسود</strong> — أسود طبيعي، وأسود مؤكسد.</li><li><strong>خضروات مخللة</strong> — فلفل هالبينو مقطع، وقلوب أرضي شوكي متبّلة، وفلفل بيبرونشيني.</li></ul></div><p class="body">والأعيرة ومواصفات المحلول الملحي والصيغ لكل منتج منشورة في كتالوج المنتجات وعلى صفحة كل منتج.</p></div>
<div class="block"><h2>التغليف</h2><p class="body">برطمانات زجاجية، وعلب صفيح، ودِلاء بلاستيكية، وبراميل بلاستيكية (للمحلول الملحي بالجملة)، حسب المنتج وحجم الطلب — وهذه هي صيغ التغليف التي أكّدنا توفرها فعليًا. ويتوفر التغليف بالعلامة الخاصة و OEM عبر صيغ الزجاج والصفيح والدلو والبرميل؛ ويُؤكَّد التصميم والملصقات والحد الأدنى للكميات الخاصة بالتغليف المخصص لكل مشروع على حدة.</p></div>
<div class="block"><h2>الشروط التجارية</h2><ul class="list long"><li><strong>الحد الأدنى للطلب</strong> — حاوية واحدة مقاس <span dir="ltr">20</span> قدمًا، أي ما يقارب <span dir="ltr">16</span> إلى <span dir="ltr">18</span> طنًا متريًا. ولا تتوفر طلبات تجريبية أصغر؛ ويمكن أن تسبق الطلبَ عينةٌ من <span dir="ltr">1</span> إلى <span dir="ltr">5</span> كجم. ويُؤكَّد الحد الأدنى الدقيق أثناء عرض السعر.</li><li><strong>الدفع</strong> — عادةً <span dir="ltr">30%</span> دفعة مقدمة تحويلًا بنكيًا مقابل <span dir="ltr">70%</span> عند نسخة بوليصة الشحن.</li><li><strong>شروط الإنكوترمز ومدة التنفيذ</strong> — تُؤكَّد لكل طلب.</li><li><strong>المستندات</strong> — فاتورة تجارية، وقائمة تعبئة، وشهادة منشأ، وشهادة صحية أو نباتية، وبوليصة شحن، تُجهَّز لكل شحنة.</li></ul></div>
<div class="block"><h2>الأسواق التي نتواصل معها</h2><p class="body">نتواصل بفاعلية مع مشترين في أفريقيا والشرق الأوسط وآسيا. هذه هي الأسواق التي نبني فيها علاقاتنا، وليست أسواقًا نخدمها حاليًا بسجل شحن راسخ. ولم تُتمّ الشركة الثلاثية للتنمية الصناعية بعد أي شحنة تصدير.</p></div>
<div class="block"><h2>أين تقف مستنداتنا</h2><p class="body">معلومات الجودة والمستندات موضّحة في ثلاثة مستويات على صفحة الجودة والوثائق: ما هو منشور على الموقع اليوم، وما نؤكّده كتابةً لطلبك تحديدًا، وما لا يزال قيد الإعداد. ولا يظهر اسم أي شهادة أو رقمها أو جهة إصدارها أو نطاقها في أي مكان على موقعنا قبل مطابقتها على مستند الشهادة نفسه.</p></div>
<div class="block closing"><p class="note">كل ما سبق منشور على هذا الموقع. وموقف مستنداتنا، منتجًا بمنتج، موضّح في الجودة والوثائق.</p></div>

<script>
/*
 * The layout: the flow above, poured onto fixed A4 pages. A block that does
 * not fit splits between its items (the first part keeping the heading) or,
 * if not even its heading and first item fit, moves to the next page. An
 * item is never split. Runs again, from the start, whenever it is called:
 * the generator calls it once the PDF's own fonts are on.
 */
window.tcFit = () => {
  const tpl = (id) => document.getElementById(id).content;
  const pages = document.getElementById('pages');
  let body;
  const newPage = (first) => {
    const pg = document.createElement('section');
    pg.className = 'pdf-page doc-page';
    pg.appendChild(tpl(first ? 'page-one' : 'page-next').cloneNode(true));
    body = document.createElement('div');
    body.className = 'page-body';
    pg.appendChild(body);
    pg.appendChild(tpl('page-foot').cloneNode(true));
    pages.appendChild(pg);
  };
  // Content stops at least 3 mm (11px) above the foot's rule.
  const limit = () => body.parentElement.querySelector('.foot').getBoundingClientRect().top - 11;
  const fits = () => {
    const last = body.lastElementChild;
    return !last || last.getBoundingClientRect().bottom <= limit();
  };
  const layout = () => {
    pages.textContent = '';
    const place = (blk) => {
      body.appendChild(blk);
      if (fits()) return;
      if (blk.classList.contains('keep') && body.children.length > 1) {
        blk.remove();
        newPage(false);
        body.appendChild(blk);
        return;
      }
      const head = blk.querySelector(':scope > h2');
      const items = [...blk.children].filter((c) => c !== head);
      blk.remove();
      const part = blk.cloneNode(false);
      if (head) part.appendChild(head);
      body.appendChild(part);
      let i = 0;
      for (; i < items.length; i++) {
        part.appendChild(items[i]);
        if (!fits()) { items[i].remove(); break; }
      }
      // A long list (class "long") that does not fit breaks between whole
      // points, at least two on each side; every other item moves whole.
      let broke = false;
      if (i < items.length) {
        const it = items[i];
        const ul = it.matches('ul.list.long') ? it : it.matches('.unit') ? it.querySelector(':scope > ul.list.long') : null;
        if (ul && ul.children.length >= 4) {
          const first = it.cloneNode(true);
          const firstUl = first.matches('ul') ? first : first.querySelector(':scope > ul');
          part.appendChild(first);
          // Leave at least two points for the next page, then take off more
          // until what stays fits, keeping at least two here.
          let k = ul.children.length;
          while (k > ul.children.length - 2) { firstUl.lastElementChild.remove(); k--; }
          while (k > 2 && !fits()) { firstUl.lastElementChild.remove(); k--; }
          if (fits() && ul.children.length - k >= 2) {
            const restUl = ul.cloneNode(false);
            restUl.classList.add('cont');
            [...ul.children].slice(k).forEach((li) => restUl.appendChild(li));
            items[i] = restUl;
            broke = true;
          } else first.remove();
        }
      }
      if (i === 0 && !broke) part.remove();
      if (i === items.length) return;
      const rest = blk.cloneNode(false);
      if (i === 0 && head && !broke) rest.appendChild(head); else rest.classList.add('cont');
      items.slice(i).forEach((it) => rest.appendChild(it));
      if (!body.children.length) { body.appendChild(rest); return; } // too tall for any page: the generator refuses it
      newPage(false);
      place(rest);
    };
    newPage(true);
    for (const blk of [...tpl('flow').cloneNode(true).children]) place(blk);
    // How full the last page is, from the top of its content to its foot.
    const top = body.getBoundingClientRect().top;
    const last = body.lastElementChild.getBoundingClientRect().bottom;
    return { count: pages.children.length, fill: (last - top) / (limit() - top) };
  };
  // One fixed type scale for every document (owner, 2026-10-13): a short
  // last page stays short rather than the type growing or shrinking to fill
  // it. Its fill is recorded for the report.
  //
  // One exception (owner, 2026-10-13): a document whose last page holds only
  // a few lines (under a quarter of the page) is laid out again with tighter
  // spacing between sections and items -- the type is never resized -- and
  // kept that way only if that removes the page.
  pages.classList.remove('tight');
  let result = layout();
  if (result.count > 1 && result.fill < 0.4) {
    const before = result.count;
    pages.classList.add('tight');
    result = layout();
    if (result.count >= before) { pages.classList.remove('tight'); result = layout(); }
  }
  document.documentElement.dataset.fill = result.fill.toFixed(2);
  document.documentElement.dataset.tight = pages.classList.contains('tight') ? '1' : '0';
  const all = pages.querySelectorAll('.pdf-page');
  all.forEach((pg, n) => { pg.querySelector('.pageno').textContent = (n + 1) + ' / ' + all.length; });
};
window.tcFit();
</script>
