<template id="flow">
<div class="block"><h2>صيغ التغليف التي نقدمها</h2><ul class="list"><li><strong>برطمانات زجاجية.</strong> عرض فاخر للتجزئة ومحلات الأطعمة الجاهزة. متوفرة بأحجام <span dir="ltr">320</span> و<span dir="ltr">370</span> و<span dir="ltr">467</span> و<span dir="ltr">720</span> و<span dir="ltr">1050</span> مل — <span dir="ltr">12</span> برطمانًا في الكرتونة حتى حجم <span dir="ltr">720</span> مل، و<span dir="ltr">6</span> في الكرتونة لحجم <span dir="ltr">1050</span> مل. تُبرز المنتج، وتدعم وضع الملصقات للعلامة التجارية والعلامة الخاصة.</li><li><strong>علب صفيح.</strong> ثابتة ومتينة على الرف، مثالية لخدمات الأغذية، والتصدير للمناخات الحارة، وخطوط الزيتون الأسود المؤكسد. متوفرة بمقاسات <span dir="ltr">65</span> مم و<span dir="ltr">A9</span> و<span dir="ltr">A10</span> و<span dir="ltr">A12</span> — <span dir="ltr">12</span> علبة في الكرتونة لمقاس <span dir="ltr">65</span> مم، و<span dir="ltr">6</span> لمقاسي <span dir="ltr">A9</span> و<span dir="ltr">A10</span>، و<span dir="ltr">4</span> لمقاس <span dir="ltr">A12</span>. تُكدَّس وتُشحن بكفاءة.</li><li><strong>دِلاء بلاستيكية.</strong> دِلاء درجة غذائية بأحجام <span dir="ltr">2</span> و<span dir="ltr">5</span> و<span dir="ltr">10</span> و<span dir="ltr">20</span> كجم، للمطاعم ومقدمي خدمات الطعام وشركات إعادة التعبئة. توازن بين التكلفة والحجم والملاءمة.</li><li><strong>براميل بلاستيكية.</strong> لنضج المحلول الملحي بالجملة والشحن في براميل سعة <span dir="ltr">220</span> كجم، لأقل تكلفة لكل كيلوجرام في الأحجام الكبيرة.</li></ul><p class="body">هذه هي صيغ التغليف المؤكد توفرها. وتُؤكَّد الأحجام الدقيقة، وتكوينات الكراتين، والحد الأدنى للطلب لكل صيغة أثناء عرض السعر، وتعتمد على المنتج المحدد وحجم الطلب.</p></div>
<div class="block"><h2>فهم تصنيف الأعيرة</h2><p class="body">يُصنَّف زيتون المائدة حسب العيار — عدد حبات الزيتون لكل كيلوجرام، يُكتب كنطاق مثل <span dir="ltr">181/200</span>. الرقم الأقل يعني حبات زيتون أكبر حجمًا. نوفّر أعيرة من <span dir="ltr">140</span> إلى <span dir="ltr">360</span>، ويُؤكَّد عيار طلبك في عرض السعر. ونطاقات الأعيرة الدقيقة المتاحة لكل صنف مدرجة في كتالوج المنتجات وصفحة كل منتج الخاصة به.</p></div>
<div class="block"><h2>تغليف العلامة الخاصة و OEM</h2><p class="body">علامتك، وتصميم تغليفك الخاص، ومنتجنا الجاهز للتصدير. ندعم التغليف بالعلامة الخاصة عبر صيغ الزجاج والصفيح والدلو والبرميل، متولّين الطباعة والتعبئة ومستندات التصدير. ويمكننا المساعدة في تصميم الملصق عند الطلب. ويُؤكَّد الحد الأدنى للطلب، ومواصفات التصميم الفني، ومتطلبات وضع الملصقات للعلامة الخاصة والتغليف المخصص لكل مشروع أثناء عرض السعر، حيث تعتمد على الصيغة وطريقة الطباعة والحجم الذي تحتاجه.</p></div>
<div class="block closing"><p class="note">تُؤكَّد المقاسات الدقيقة وتكوينات الكراتين والحد الأدنى للكميات أثناء عرض السعر.</p></div>

<main id="pages"></main>
<script>
/*
 * The layout: the flow above, poured onto fixed A4 pages. A block that does
 * not fit splits between its items (the first part keeping the heading) or,
 * if not even its heading and first item fit, moves to the next page. An
 * item is never split. Runs again, from the start, whenever it is called:
 * the generator calls it once the PDF's own fonts are on.
 */
window.tcFit = () => {
  const tpl = (id) => document.getElementById(id).content;
  const pages = document.getElementById('pages');
  let body;
  const newPage = (first, scale) => {
    const pg = document.createElement('section');
    pg.className = 'pdf-page doc-page';
    pg.appendChild(tpl(first ? 'page-one' : 'page-next').cloneNode(true));
    body = document.createElement('div');
    body.className = 'page-body';
    body.style.zoom = scale;
    pg.appendChild(body);
    pg.appendChild(tpl('page-foot').cloneNode(true));
    pages.appendChild(pg);
  };
  const limit = () => body.parentElement.querySelector('.foot').getBoundingClientRect().top - 2;
  const fits = () => {
    const last = body.lastElementChild;
    return !last || last.getBoundingClientRect().bottom <= limit();
  };
  const layout = (scale) => {
    pages.textContent = '';
    const place = (blk) => {
      body.appendChild(blk);
      if (fits()) return;
      if (blk.classList.contains('keep') && body.children.length > 1) {
        blk.remove();
        newPage(false, scale);
        body.appendChild(blk);
        return;
      }
      const head = blk.querySelector(':scope > h2');
      const items = [...blk.children].filter((c) => c !== head);
      blk.remove();
      const part = blk.cloneNode(false);
      if (head) part.appendChild(head);
      body.appendChild(part);
      let i = 0;
      for (; i < items.length; i++) {
        part.appendChild(items[i]);
        if (!fits()) { items[i].remove(); break; }
      }
      if (i === 0) part.remove();
      if (i === items.length) return;
      const rest = blk.cloneNode(false);
      if (i === 0 && head) rest.appendChild(head); else rest.classList.add('cont');
      items.slice(i).forEach((it) => rest.appendChild(it));
      if (!body.children.length) { body.appendChild(rest); return; } // too tall for any page: the generator refuses it
      newPage(false, scale);
      place(rest);
    };
    newPage(true, scale);
    for (const blk of [...tpl('flow').cloneNode(true).children]) place(blk);
    // How full the last page is, from the top of its content to its foot.
    const top = body.getBoundingClientRect().top;
    const last = body.lastElementChild.getBoundingClientRect().bottom;
    return { scale, count: pages.children.length, fill: (last - top) / (limit() - top) };
  };
  /*
   * The scale: the type and spacing of the content, together. The brief
   * allows no page more than about a quarter empty, and a document's length
   * is what its source says, so the scale is chosen to fill its last page:
   * the scale nearest 1 that leaves the last page at least three-quarters
   * full, or failing that the one that fills it most. 0.96 keeps every size
   * above the brief's minimums (body 11pt, tables 10pt, labels 8pt).
   */
  const SCALES = [1, 0.96, 1.04, 1.08, 1.12, 1.16, 1.2];
  const tried = SCALES.map(layout);
  const good = tried.filter((t) => t.fill >= 0.75);
  const pick = good.length ? good.sort((a, b) => Math.abs(a.scale - 1) - Math.abs(b.scale - 1))[0]
    : tried.sort((a, b) => b.fill - a.fill)[0];
  const result = layout(pick.scale);
  document.documentElement.dataset.scale = pick.scale;
  document.documentElement.dataset.fill = result.fill.toFixed(2);
  const all = pages.querySelectorAll('.pdf-page');
  all.forEach((pg, n) => { pg.querySelector('.pageno').textContent = (n + 1) + ' / ' + all.length; });
};
window.tcFit();
</script>
