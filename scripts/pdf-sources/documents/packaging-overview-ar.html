<template id="flow">
<div class="block"><h2>صيغ التغليف التي نقدمها</h2><ul class="list long"><li><strong>برطمانات زجاجية.</strong> عرض فاخر للتجزئة ومحلات الأطعمة الجاهزة. متوفرة بأحجام <span dir="ltr">320</span> و<span dir="ltr">370</span> و<span dir="ltr">467</span> و<span dir="ltr">720</span> و<span dir="ltr">1050</span> مل — <span dir="ltr">12</span> برطمانًا في الكرتونة حتى حجم <span dir="ltr">720</span> مل، و<span dir="ltr">6</span> في الكرتونة لحجم <span dir="ltr">1050</span> مل. تُبرز المنتج، وتدعم وضع الملصقات للعلامة التجارية والعلامة الخاصة.</li><li><strong>علب صفيح.</strong> ثابتة ومتينة على الرف، مثالية لخدمات الأغذية، والتصدير للمناخات الحارة، وخطوط الزيتون الأسود المؤكسد. متوفرة بمقاسات <span dir="ltr">65</span> مم و<span dir="ltr">A9</span> و<span dir="ltr">A10</span> و<span dir="ltr">A12</span> — <span dir="ltr">12</span> علبة في الكرتونة لمقاس <span dir="ltr">65</span> مم، و<span dir="ltr">6</span> لمقاسي <span dir="ltr">A9</span> و<span dir="ltr">A10</span>، و<span dir="ltr">4</span> لمقاس <span dir="ltr">A12</span>. تُكدَّس وتُشحن بكفاءة.</li><li><strong>دِلاء بلاستيكية.</strong> دِلاء درجة غذائية بأحجام <span dir="ltr">2</span> و<span dir="ltr">5</span> و<span dir="ltr">10</span> و<span dir="ltr">20</span> كجم، للمطاعم ومقدمي خدمات الطعام وشركات إعادة التعبئة. توازن بين التكلفة والحجم والملاءمة.</li><li><strong>براميل بلاستيكية.</strong> لنضج المحلول الملحي بالجملة والشحن في براميل سعة <span dir="ltr">220</span> كجم، لأقل تكلفة لكل كيلوجرام في الأحجام الكبيرة.</li></ul><p class="body">هذه هي صيغ التغليف المؤكد توفرها. وتُؤكَّد الأحجام الدقيقة، وتكوينات الكراتين، والحد الأدنى للطلب لكل صيغة أثناء عرض السعر، وتعتمد على المنتج المحدد وحجم الطلب.</p></div>
<div class="block"><h2>فهم تصنيف الأعيرة</h2><p class="body">يُصنَّف زيتون المائدة حسب العيار — عدد حبات الزيتون لكل كيلوجرام، يُكتب كنطاق مثل <span dir="ltr">181/200</span>. الرقم الأقل يعني حبات زيتون أكبر حجمًا. نوفّر أعيرة من <span dir="ltr">140</span> إلى <span dir="ltr">360</span>، ويُؤكَّد عيار طلبك في عرض السعر. ونطاقات الأعيرة الدقيقة المتاحة لكل صنف مدرجة في كتالوج المنتجات وصفحة كل منتج الخاصة به.</p></div>
<div class="block"><h2>تغليف العلامة الخاصة و OEM</h2><p class="body">علامتك، وتصميم تغليفك الخاص، ومنتجنا الجاهز للتصدير. ندعم التغليف بالعلامة الخاصة عبر صيغ الزجاج والصفيح والدلو والبرميل، متولّين الطباعة والتعبئة ومستندات التصدير. ويمكننا المساعدة في تصميم الملصق عند الطلب. ويُؤكَّد الحد الأدنى للطلب، ومواصفات التصميم الفني، ومتطلبات وضع الملصقات للعلامة الخاصة والتغليف المخصص لكل مشروع أثناء عرض السعر، حيث تعتمد على الصيغة وطريقة الطباعة والحجم الذي تحتاجه.</p></div>
<div class="block closing"><p class="note">تُؤكَّد المقاسات الدقيقة وتكوينات الكراتين والحد الأدنى للكميات أثناء عرض السعر.</p></div>

<main id="pages"></main>
<script>
/*
 * The layout: the flow above, poured onto fixed A4 pages. A block that does
 * not fit splits between its items (the first part keeping the heading) or,
 * if not even its heading and first item fit, moves to the next page. An
 * item is never split. Runs again, from the start, whenever it is called:
 * the generator calls it once the PDF's own fonts are on.
 */
window.tcFit = () => {
  const tpl = (id) => document.getElementById(id).content;
  const pages = document.getElementById('pages');
  let body;
  const newPage = (first) => {
    const pg = document.createElement('section');
    pg.className = 'pdf-page doc-page';
    pg.appendChild(tpl(first ? 'page-one' : 'page-next').cloneNode(true));
    body = document.createElement('div');
    body.className = 'page-body';
    pg.appendChild(body);
    pg.appendChild(tpl('page-foot').cloneNode(true));
    pages.appendChild(pg);
  };
  // Content stops at least 3 mm (11px) above the foot's rule.
  const limit = () => body.parentElement.querySelector('.foot').getBoundingClientRect().top - 11;
  const fits = () => {
    const last = body.lastElementChild;
    return !last || last.getBoundingClientRect().bottom <= limit();
  };
  const layout = () => {
    pages.textContent = '';
    const place = (blk) => {
      body.appendChild(blk);
      if (fits()) return;
      if (blk.classList.contains('keep') && body.children.length > 1) {
        blk.remove();
        newPage(false);
        body.appendChild(blk);
        return;
      }
      const head = blk.querySelector(':scope > h2');
      const items = [...blk.children].filter((c) => c !== head);
      blk.remove();
      const part = blk.cloneNode(false);
      if (head) part.appendChild(head);
      body.appendChild(part);
      let i = 0;
      for (; i < items.length; i++) {
        part.appendChild(items[i]);
        if (!fits()) { items[i].remove(); break; }
      }
      // A long list (class "long") that does not fit breaks between whole
      // points, at least two on each side; every other item moves whole.
      let broke = false;
      if (i < items.length) {
        const it = items[i];
        const ul = it.matches('ul.list.long') ? it : it.matches('.unit') ? it.querySelector(':scope > ul.list.long') : null;
        if (ul && ul.children.length >= 4) {
          const first = it.cloneNode(true);
          const firstUl = first.matches('ul') ? first : first.querySelector(':scope > ul');
          part.appendChild(first);
          // Leave at least two points for the next page, then take off more
          // until what stays fits, keeping at least two here.
          let k = ul.children.length;
          while (k > ul.children.length - 2) { firstUl.lastElementChild.remove(); k--; }
          while (k > 2 && !fits()) { firstUl.lastElementChild.remove(); k--; }
          if (fits() && ul.children.length - k >= 2) {
            const restUl = ul.cloneNode(false);
            restUl.classList.add('cont');
            [...ul.children].slice(k).forEach((li) => restUl.appendChild(li));
            items[i] = restUl;
            broke = true;
          } else first.remove();
        }
      }
      if (i === 0 && !broke) part.remove();
      if (i === items.length) return;
      const rest = blk.cloneNode(false);
      if (i === 0 && head && !broke) rest.appendChild(head); else rest.classList.add('cont');
      items.slice(i).forEach((it) => rest.appendChild(it));
      if (!body.children.length) { body.appendChild(rest); return; } // too tall for any page: the generator refuses it
      newPage(false);
      place(rest);
    };
    newPage(true);
    for (const blk of [...tpl('flow').cloneNode(true).children]) place(blk);
    // How full the last page is, from the top of its content to its foot.
    const top = body.getBoundingClientRect().top;
    const last = body.lastElementChild.getBoundingClientRect().bottom;
    return { count: pages.children.length, fill: (last - top) / (limit() - top) };
  };
  // One fixed type scale for every document (owner, 2026-10-13): a short
  // last page stays short rather than the type growing or shrinking to fill
  // it. Its fill is recorded for the report.
  //
  // One exception (owner, 2026-10-13): a document whose last page holds only
  // a few lines (under a quarter of the page) is laid out again with tighter
  // spacing between sections and items -- the type is never resized -- and
  // kept that way only if that removes the page.
  pages.classList.remove('tight');
  let result = layout();
  if (result.count > 1 && result.fill < 0.4) {
    const before = result.count;
    pages.classList.add('tight');
    result = layout();
    if (result.count >= before) { pages.classList.remove('tight'); result = layout(); }
  }
  document.documentElement.dataset.fill = result.fill.toFixed(2);
  document.documentElement.dataset.tight = pages.classList.contains('tight') ? '1' : '0';
  const all = pages.querySelectorAll('.pdf-page');
  all.forEach((pg, n) => { pg.querySelector('.pageno').textContent = (n + 1) + ' / ' + all.length; });
};
window.tcFit();
</script>
