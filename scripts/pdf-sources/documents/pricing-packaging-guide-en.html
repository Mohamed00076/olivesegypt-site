<div class="block"><h2>What Drives the Price per KG</h2><div class="unit"><p class="body">Table-olive prices move with the season, so we don't publish a fixed price list — any number printed today could be wrong by the time you read it. Here is what actually drives the price, and how to get a current, honest quote.</p><div class="cards"><div class="card"><h3>Harvest yield &amp; weather</h3><p>Egypt's main olive harvest runs through the autumn. A strong yield increases supply and softens prices into the new season; drought or an off-cycle year (olive trees follow a natural biennial bearing pattern) tightens availability.</p></div><div class="card"><h3>Currency movements</h3><p>Quotes and payment can be in USD or EUR. Movements in the Egyptian pound's exchange rate can affect prices between quotations. Currency volatility introduces short-term swings worth watching if you're timing an order.</p></div><div class="card"><h3>Variety &amp; caliber</h3><p>Price varies by product, caliber, packaging and order volume, and is confirmed in the quotation.</p></div><div class="card"><h3>Packaging &amp; freight</h3><p>Glass costs more per unit than bulk barrel; ocean freight rates and container availability also feed into your landed cost even when the FOB price hasn't moved.</p></div></div></div><p class="body"><strong>An illustrative example</strong> (not a quote): consider a buyer sourcing Green Olives, caliber 141/160, in bulk barrel packaging, for a full 20ft container FOB Alexandria. Their landed cost per kg would reflect the current FOB price for that caliber and packaging, ocean freight to their port, import duty in their market, and any local repacking cost. Illustrative only — not a quote or a binding offer. Actual FOB pricing depends on the current season and is confirmed on request.</p></div>

4" aria-hidden="true" focusable="false"><path d="M6 3h12c1.3 2.6 2 5.6 2 9s-.7 6.4-2 9H6c-1.3-2.6-2-5.6-2-9s.7-6.4 2-9z"/><path d="M4.4 8h15.2"/><path d="M4.4 16h15.2"/></svg></span>Plastic barrels</th><td>220 kg</td><td>Confirmed during quotation</td><td>Bulk brine maturation and shipping; the lowest cost per kilogram on large volumes</td></tr> </tbody></table><p class="body">These are the packaging formats confirmed as available. Exact sizes, case configurations, and minimum order quantities per format are confirmed during quotation and depend on the specific product and order volume.</p></div>
<div class="block"><h2>Understanding Caliber Sizing</h2><p class="body">Table olives are graded by caliber — the count of olives per kilogram, written as a range such as 181/200. A lower number means larger individual olives. We supply calibers from 140 to 360; the caliber for your order is confirmed in the quotation. Exact caliber ranges available for each variety are listed on the product catalog and each product's own page.</p><figure class="caliber-scale" aria-label="Drawing: seven olives in a row, from the largest beside 140 to the smallest beside 360.">

<div class="block"><h2>Private Label &amp; OEM Packaging</h2><p class="body">Your brand, your packaging design, our export-ready product. We support private-label packaging across glass, tin, bucket, and barrel formats, handling printing, filling, and export documentation. We can help with label design on request. Minimum order quantity, artwork specifications, and labeling requirements for private-label and custom packaging are confirmed per project during quotation, since they depend on the format, print method, and volume you need.</p></div>
<div class="block"><h2>What to Tell Us for a Quotation</h2><div class="unit"><p class="body">Tell us the following and we'll confirm a current, honest price against exactly those terms rather than a generic range:</p><ul class="list"><li>Product type and form (green, stuffed green, natural black, oxidized black; whole, pitted or sliced) and caliber</li><li>Any specific cultivar (availability is checked per request)</li><li>Packaging format</li><li>Target order volume</li><li>Destination port</li><li>Incoterm (FOB, CIF or CFR)</li></ul></div></div>

<script>
/*
 * The layout: the flow above, poured onto fixed A4 pages. A block that does
 * not fit splits between its items (the first part keeping the heading) or,
 * if not even its heading and first item fit, moves to the next page. An
 * item is never split. Runs again, from the start, whenever it is called:
 * the generator calls it once the PDF's own fonts are on.
 */
window.tcFit = () => {
  const tpl = (id) => document.getElementById(id).content;
  const pages = document.getElementById('pages');
  let body;
  const newPage = (first) => {
    const pg = document.createElement('section');
    pg.className = 'pdf-page doc-page';
    pg.appendChild(tpl(first ? 'page-one' : 'page-next').cloneNode(true));
    body = document.createElement('div');
    body.className = 'page-body';
    pg.appendChild(body);
    pg.appendChild(tpl('page-foot').cloneNode(true));
    pages.appendChild(pg);
  };
  // Content stops at least 3 mm (11px) above the foot's rule.
  const limit = () => body.parentElement.querySelector('.foot').getBoundingClientRect().top - 11;
  const fits = () => {
    const last = body.lastElementChild;
    return !last || last.getBoundingClientRect().bottom <= limit();
  };
  const layout = (breakBefore = -1) => {
    pages.textContent = '';
    const place = (blk) => {
      body.appendChild(blk);
      if (fits()) return;
      if (blk.classList.contains('keep') && body.children.length > 1) {
        blk.remove();
        newPage(false);
        body.appendChild(blk);
        return;
      }
      const head = blk.querySelector(':scope > h2');
      const items = [...blk.children].filter((c) => c !== head);
      blk.remove();
      const part = blk.cloneNode(false);
      if (head) part.appendChild(head);
      body.appendChild(part);
      let i = 0;
      for (; i < items.length; i++) {
        part.appendChild(items[i]);
        if (!fits()) { items[i].remove(); break; }
      }
      // A long list (class "long") that does not fit breaks between whole
      // points, at least two on each side; every other item moves whole.
      let broke = false;
      if (i < items.length) {
        const it = items[i];
        const ul = it.matches('ul.list.long') ? it : it.matches('.unit') ? it.querySelector(':scope > ul.list.long') : null;
        if (ul && ul.children.length >= 4) {
          const first = it.cloneNode(true);
          const firstUl = first.matches('ul') ? first : first.querySelector(':scope > ul');
          part.appendChild(first);
          // Leave at least two points for the next page, then take off more
          // until what stays fits, keeping at least two here.
          let k = ul.children.length;
          while (k > ul.children.length - 2) { firstUl.lastElementChild.remove(); k--; }
          while (k > 2 && !fits()) { firstUl.lastElementChild.remove(); k--; }
          if (fits() && ul.children.length - k >= 2) {
            const restUl = ul.cloneNode(false);
            restUl.classList.add('cont');
            [...ul.children].slice(k).forEach((li) => restUl.appendChild(li));
            items[i] = restUl;
            broke = true;
          } else first.remove();
        }
      }
      if (i === 0 && !broke) part.remove();
      if (i === items.length) return;
      const rest = blk.cloneNode(false);
      if (i === 0 && head && !broke) rest.appendChild(head); else rest.classList.add('cont');
      items.slice(i).forEach((it) => rest.appendChild(it));
      if (!body.children.length) { body.appendChild(rest); return; } // too tall for any page: the generator refuses it
      newPage(false);
      place(rest);
    };
    newPage(true);
    [...tpl('flow').cloneNode(true).children].forEach((blk, i) => {
      blk.dataset.i = i;
      if (i === breakBefore && body.children.length) newPage(false);
      place(blk);
    });
    // How full the last page is, from the top of its content to its foot.
    const top = body.getBoundingClientRect().top;
    const last = body.lastElementChild.getBoundingClientRect().bottom;
    return { count: pages.children.length, fill: (last - top) / (limit() - top) };
  };
  // One fixed type scale for every document (owner, 2026-10-13): a short
  // last page stays short rather than the type growing or shrinking to fill
  // it. Its fill is recorded for the report.
  //
  // No spacing is squeezed to save a page (owner, 2026-10-14: "a little bit
  // crowded"; the tighter-spacing pass that pulled a short last page back
  // was removed): room on the page comes before the page count.
  let result = layout();
  // A closing line never stands alone on the last page: the section before
  // it moves over to keep it company (it starts that page instead), as long
  // as that leaves something on the page it came from.
  const bodies = [...pages.querySelectorAll('.page-body')];
  const lastBody = bodies[bodies.length - 1];
  if (bodies.length > 1 && [...lastBody.children].every((c) => c.classList.contains('closing'))) {
    const prev = bodies[bodies.length - 2];
    const mover = prev.lastElementChild;
    if (mover && prev.children.length > 1 && mover.dataset.i !== undefined) result = layout(Number(mover.dataset.i));
  }
  document.documentElement.dataset.fill = result.fill.toFixed(2);
  const all = pages.querySelectorAll('.pdf-page');
  all.forEach((pg, n) => { pg.querySelector('.pageno').textContent = (n + 1) + ' / ' + all.length; });
};
window.tcFit();
</script>
