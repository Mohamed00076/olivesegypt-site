<div class="block"><h2>Who we are</h2><p class="body">Triple Company for Industrial Development is a newly established Egyptian table-olive export company, based at Ouroba Square (<span class="ar-inline" lang="ar" dir="rtl">ميدان العروبة</span>), 5th Settlement, New Cairo, Cairo, Egypt. We are actively developing our first international buyer relationships. We are direct about this because we would rather earn your trust with an honest first order than with an inflated track record.</p></div>
<div class="block"><h2>How we operate</h2><div class="unit"><p class="body">We do not own the processing facility. We work with an approved partner arrangement for processing and storage: Triple Company for Industrial Development handles sourcing, quality specification, sales and export logistics, while the physical processing and brining takes place at a partner facility in the 10th of Ramadan Industrial Zone.</p><ul class="list"><li><strong>We handle</strong> — sourcing and lot selection, product specification, buyer communication and commercial terms, export coordination and port handling, and the export documentation pack.</li><li><strong>The approved partner facility handles</strong> — processing and brining, grading to the agreed caliber, filling and packing, labelling to the approved artwork, and holding whatever certifications it holds, in its own name.</li></ul></div></div>
<div class="block"><h2>The range</h2><div class="unit"><p class="body">Seven products across three groups.</p><ul class="list"><li><strong>Green olives</strong> — Green Olives and Stuffed Green Olives.</li><li><strong>Black olives</strong> — Natural Black and Oxidized Black.</li><li><strong>Pickled vegetables</strong> — Sliced Jalapeño Peppers, Marinated Artichoke Hearts, and Pepperoncini Peppers.</li></ul></div><p class="body">Calibers, brine specifications and formats for each product are published on the product catalogue and on each product’s own page.</p></div>
<div class="block"><h2>Packaging</h2><p class="body">Glass jars, tin cans, plastic buckets, and plastic barrels (for bulk brine), depending on the product and order volume — these are the packaging formats we have actually confirmed as available. Private-label and OEM packaging is available across glass, tin, bucket and barrel formats; artwork, labelling and minimum quantities for custom packaging are confirmed per project.</p></div>
<div class="block"><h2>Commercial terms</h2><ul class="list"><li><strong>Minimum order</strong> — one 20ft container, approximately <span class="nb">16–18</span> metric tons. Smaller trial orders are not available; a <span class="nb">1–5</span> kg sample can come first. Exact MOQ is confirmed during quotation.</li><li><strong>Payment</strong> — typically 30% T/T deposit against 70% on bill-of-lading copy.</li><li><strong>Incoterms and lead time</strong> — confirmed per order.</li><li><strong>Documentation</strong> — commercial invoice, packing list, certificate of origin, phytosanitary or health certificate, and bill of lading, prepared for every shipment.</li></ul></div>
<div class="block"><h2>Markets we are engaging</h2><p class="body">We are actively engaging buyers in Africa, the Middle East and Asia. These are the markets we are building relationships in — not markets we currently serve with an established shipping history. Triple Company for Industrial Development has not yet completed an export shipment.</p></div>
<div class="block"><h2>Where our documentation stands</h2><p class="body">Quality and documentation information is set out in three tiers on our Quality &amp; Documentation page: what is published on the site today, what we confirm in writing for your specific order, and what is still being established. No certificate name, number, issuing body or scope appears anywhere on our site until it has been checked against the actual certificate document.</p></div>
<div class="block closing"><p class="note">Everything above is published on this site. Where our documentation stands, product by product, is set out on Quality &amp; Documentation.</p></div>

<script>
/*
 * The layout: the flow above, poured onto fixed A4 pages. A block that does
 * not fit splits between its items (the first part keeping the heading) or,
 * if not even its heading and first item fit, moves to the next page. An
 * item is never split. Runs again, from the start, whenever it is called:
 * the generator calls it once the PDF's own fonts are on.
 */
window.tcFit = () => {
  const tpl = (id) => document.getElementById(id).content;
  const pages = document.getElementById('pages');
  let body;
  const newPage = (first) => {
    const pg = document.createElement('section');
    pg.className = 'pdf-page doc-page';
    pg.appendChild(tpl(first ? 'page-one' : 'page-next').cloneNode(true));
    body = document.createElement('div');
    body.className = 'page-body';
    pg.appendChild(body);
    pg.appendChild(tpl('page-foot').cloneNode(true));
    pages.appendChild(pg);
  };
  const limit = () => body.parentElement.querySelector('.foot').getBoundingClientRect().top - 2;
  const fits = () => {
    const last = body.lastElementChild;
    return !last || last.getBoundingClientRect().bottom <= limit();
  };
  const layout = () => {
    pages.textContent = '';
    const place = (blk) => {
      body.appendChild(blk);
      if (fits()) return;
      if (blk.classList.contains('keep') && body.children.length > 1) {
        blk.remove();
        newPage(false);
        body.appendChild(blk);
        return;
      }
      const head = blk.querySelector(':scope > h2');
      const items = [...blk.children].filter((c) => c !== head);
      blk.remove();
      const part = blk.cloneNode(false);
      if (head) part.appendChild(head);
      body.appendChild(part);
      let i = 0;
      for (; i < items.length; i++) {
        part.appendChild(items[i]);
        if (!fits()) { items[i].remove(); break; }
      }
      if (i === 0) part.remove();
      if (i === items.length) return;
      const rest = blk.cloneNode(false);
      if (i === 0 && head) rest.appendChild(head); else rest.classList.add('cont');
      items.slice(i).forEach((it) => rest.appendChild(it));
      if (!body.children.length) { body.appendChild(rest); return; } // too tall for any page: the generator refuses it
      newPage(false);
      place(rest);
    };
    newPage(true);
    for (const blk of [...tpl('flow').cloneNode(true).children]) place(blk);
    // How full the last page is, from the top of its content to its foot.
    const top = body.getBoundingClientRect().top;
    const last = body.lastElementChild.getBoundingClientRect().bottom;
    return { count: pages.children.length, fill: (last - top) / (limit() - top) };
  };
  // One fixed type scale for every document (owner, 2026-10-13): a short
  // last page stays short rather than the type growing or shrinking to fill
  // it. Its fill is recorded for the report.
  //
  // One exception (owner, 2026-10-13): a document whose last page holds only
  // a few lines (under a quarter of the page) is laid out again with tighter
  // spacing between sections and items -- the type is never resized -- and
  // kept that way only if that removes the page.
  pages.classList.remove('tight');
  let result = layout();
  if (result.count > 1 && result.fill < 0.25) {
    const before = result.count;
    pages.classList.add('tight');
    result = layout();
    if (result.count >= before) { pages.classList.remove('tight'); result = layout(); }
  }
  document.documentElement.dataset.fill = result.fill.toFixed(2);
  document.documentElement.dataset.tight = pages.classList.contains('tight') ? '1' : '0';
  const all = pages.querySelectorAll('.pdf-page');
  all.forEach((pg, n) => { pg.querySelector('.pageno').textContent = (n + 1) + ' / ' + all.length; });
};
window.tcFit();
</script>
