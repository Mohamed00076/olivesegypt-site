<!doctype html>
<!-- Source of /opengraph.jpg (1200x630). Render: serve the repo root (python3 -m http.server 8899),
     open http://localhost:8899/scripts/og-card.html in Chromium at a 1200x630 viewport, screenshot,
     save as JPEG quality 88. Text is limited to approved strings: legal name (EN/AR), the C-91 tagline, the domain. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{display:flex;background:hsl(75 40% 16%);font-family:'Plus Jakarta Sans',sans-serif}
.l{width:620px;height:630px;padding:56px 56px 48px 64px;display:flex;flex-direction:column;position:relative;
  background:radial-gradient(120% 90% at 0% 0%,hsl(75 38% 22%) 0%,hsl(75 40% 15%) 60%,hsl(75 42% 12%) 100%)}
.l::after{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:hsl(45 60% 50%)}
.tile{width:118px;height:132px;border-radius:14px;background:hsl(40 30% 96%);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}.logo{width:96px;height:118px;object-fit:contain}
.eyebrow{margin-top:30px;display:flex;align-items:center;gap:14px;color:hsl(45 62% 56%);font-weight:700;font-size:17px;letter-spacing:.2em;text-transform:uppercase}
.eyebrow::before{content:"";width:40px;height:2px;background:hsl(45 62% 56%)}
h1{margin-top:18px;font-family:'Playfair Display',serif;font-weight:700;color:hsl(40 30% 96%);font-size:50px;line-height:1.1}
.ar{margin-top:16px;font-family:'Noto Naskh Arabic',serif;font-weight:600;color:hsl(45 55% 66%);font-size:30px;direction:rtl;text-align:left;unicode-bidi:plaintext}
.url{margin-top:auto;color:hsl(40 20% 82%);font-size:21px;font-weight:600;letter-spacing:.04em}
.r{flex:1;display:flex;flex-direction:column;gap:4px;background:hsl(45 60% 50%)}
.r div{flex:1;background-size:cover;background-position:center}
</style></head><body>
<div class="l">
  <div class="tile"><img class="logo" src="/assets/logo-BJ1TOn9V.png" alt="Triple Company for Industrial Development logo" width="236" height="289"></div>
  <div class="eyebrow">Egyptian Table Olive Export</div>
  <h1>Triple Company for Industrial Development</h1>
  <div class="ar">الشركة الثلاثية للتنمية الصناعية</div>
  <div class="url">olivesegypt.com</div>
</div>
<div class="r">
  <div style="background-image:url(/assets/olive-aggizi-BuhWRZTd.jpg)"></div>
  <div style="background-image:url(/assets/olive-kalamata.jpg)"></div>
  <div style="background-image:url(/assets/olive-oxidized-black.jpg)"></div>
</div></body></html>
