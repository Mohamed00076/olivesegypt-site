[build]
  publish = "."
  functions = "netlify/functions"
  # Section J Phase 2 -- fetches the (country-level-only) GeoLite2
  # database from a free redistribution mirror before each deploy. Never
  # fails the build itself; see scripts/build-geo.js.
  command = "node scripts/build-geo.js"

# Persists geo/ (the downloaded GeoLite2-Country database) between
# builds. Before this, scripts/build-geo.js re-downloaded and
# re-extracted an ~8-9MB file on every single build -- including every
# PR deploy preview -- even when nothing about it had changed, burning
# build minutes for no reason. build-geo.js now checks geo/.fetched-at
# (restored from this cache) and skips the download entirely unless
# it's missing or more than a week old, so the weekly geo-refresh
# scheduled function below still keeps it current during quiet periods
# with no other deploys.
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["geo"]

[functions]
  # Bundles the freshly-downloaded geo database into every function's
  # deploy package so analytics-collect.js can read it at runtime. Well
  # under the 50MB unzipped function bundle limit (country-level file is
  # ~8-9MB) -- GeoLite2-City was ruled out specifically because it isn't
  # (see docs/j2-acceptance-criteria.md).
  included_files = ["geo/**"]

# Section J Phase 2 -- optional "scheduled auto-refresh": POSTs to a
# Netlify Build Hook weekly, which triggers a fresh deploy (re-running
# the geo download above). Requires NETLIFY_BUILD_HOOK_URL to be set;
# entirely optional otherwise -- see README.
[functions."geo-refresh"]
  schedule = "@weekly"

# Section J Phase 3 -- daily data-retention purge (analytics_sessions/
# analytics_events rows older than the configured retention window).
# Always runs; not gated on anything, unlike Search Console below.
[functions."analytics-retention"]
  schedule = "@daily"

# Section J Phase 3 -- daily Search Console import. The function itself
# checks search_console_enabled (default false) before making any call
# to Google's API -- this schedule just means "check in daily," not
# "start pulling data automatically." See README for the required setup.
[functions."search-console-import"]
  schedule = "@daily"

# Security audit (2026-09-02): baseline headers, none of which existed
# before. The CSP's script-src/style-src need 'unsafe-inline' -- this
# site's every page (forms, the CRM, the admin dashboard, the consent
# banner) is built from inline <script> and inline style="" throughout,
# and removing that would mean restructuring every HTML file to external
# scripts with nonces, a separate, much larger project. So this CSP is
# NOT primary XSS defense (that's the consistent output-escaping already
# in the JS -- CRM.escapeHtml() etc., verified during this audit) -- its
# real value here is restricting *what a script is allowed to do even if
# one runs*: no loading from or sending data to unknown external hosts
# (connect-src/script-src), no <object>/<embed> injection, no <base> tag
# hijacking, no framing (clickjacking). External hosts allowlisted below
# are exactly what this site actually loads (grepped site-wide) -- Chart.js
# from jsdelivr, Google Fonts.
#
# connect.facebook.net/www.facebook.com (added for the homepage's
# Facebook Like widget, footer "Follow Us" section): deliberately
# click-to-load, not loaded on every page view -- the SDK script and its
# iframe (which set Facebook's own cookies) only load after a visitor
# clicks "Show Facebook page," never automatically. These CSP entries
# only control *whether the browser is allowed to load it when asked*;
# they don't make it load on their own, and don't apply to the analytics
# consent system (a different, narrower "just Umami" toggle -- see
# assets/consent.js -- that this widget was deliberately kept out of
# rather than stretched to cover something it wasn't built for).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.facebook.com https://connect.facebook.net; frame-src https://www.facebook.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# A0 discovery flagged this and it was never actually done: JSON API
# responses under /admin/, /crm/, and /api/ have no HTML <meta> tag to
# carry noindex (only HTML pages do), so this carries the same signal at
# the header level for all of them, API responses included.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/crm/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

