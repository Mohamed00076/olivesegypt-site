[build]
  publish = "."
  functions = "netlify/functions"

# Admin analytics page
[[redirects]]
  from = "/admin/analytics"
  to = "/admin/analytics/index.html"
  status = 200

[[redirects]]
  from = "/admin/analytics/"
  to = "/admin/analytics/index.html"
  status = 200

# API routes → Netlify Functions
[[redirects]]
  from = "/api/inquiries"
  to = "/.netlify/functions/inquiries"
  status = 200
  force = true

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200
  force = true

[[redirects]]
  from = "/api/consent"
  to = "/.netlify/functions/consent"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200
  force = true

[[redirects]]
  from = "/api/analytics"
  to = "/.netlify/functions/analytics"
  status = 200
  force = true

# Buyer CRM (Section H) — separate auth/session from /admin/analytics above
[[redirects]]
  from = "/api/crm/auth/login"
  to = "/.netlify/functions/crm-auth-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/crm/auth/logout"
  to = "/.netlify/functions/crm-auth-logout"
  status = 200
  force = true

[[redirects]]
  from = "/api/crm/auth/me"
  to = "/.netlify/functions/crm-auth-me"
  status = 200
  force = true

[[redirects]]
  from = "/api/crm/buyers"
  to = "/.netlify/functions/crm-buyers"
  status = 200
  force = true

[[redirects]]
  from = "/api/crm/activity"
  to = "/.netlify/functions/crm-activity"
  status = 200
  force = true

[[redirects]]
  from = "/api/crm/dashboard"
  to = "/.netlify/functions/crm-dashboard"
  status = 200
  force = true

[[redirects]]
  from = "/api/crm/csv"
  to = "/.netlify/functions/crm-csv"
  status = 200
  force = true

# SPA fallback — serve index.html for all non-file routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
